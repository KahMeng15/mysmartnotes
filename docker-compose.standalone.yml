services:
  db:
    image: postgres:15-alpine
    container_name: mysmartnotes_db
    environment:
      POSTGRES_USER: mysmartnotes
      POSTGRES_PASSWORD: mysmartnotespassword
      POSTGRES_DB: mysmartnotes
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mysmartnotes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysmartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kahmeng15/mysmartnotes:latest
    container_name: mysmartnotes_api
    command: ["python", "-m", "app.main"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PORT=8000
      - DB_USER=mysmartnotes
      - DB_PASSWORD=mysmartnotespassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mysmartnotes
      - ENVIRONMENT=development
      - SECRET_KEY=your-secret-key-change-in-production
      - CORS_ALLOWED_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      - COOKIE_SECURE=false
      - COOKIE_SAMESITE=lax
      - CSRF_COOKIE_NAME=csrf_token
      - CSRF_HEADER_NAME=X-CSRF-Token
      - TASK_RETENTION_DAYS=14
      - ADMIN_EMAIL=kahmeng15@gmail.com
      - GLOBAL_AI_PROVIDER=gemini
      - GLOBAL_GEMINI_API_KEY=your-gemini-api-key
      - GLOBAL_AI_MODEL=models/gemma-4-26b-a4b-it
      - GLOBAL_REASONING_LEVEL=low
      - DEBUG=True
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - MAX_UPLOAD_SIZE_MB=50
      - FIREBASE_API_KEY=your-firebase-api-key
      - FIREBASE_AUTH_DOMAIN=
      - FIREBASE_PROJECT_ID=
      - FIREBASE_STORAGE_BUCKET=
      - FIREBASE_MESSAGING_SENDER_ID=
      - FIREBASE_APP_ID=
      - FIREBASE_MEASUREMENT_ID=
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  worker:
    image: ghcr.io/kahmeng15/mysmartnotes:latest
    container_name: mysmartnotes_worker
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_USER=mysmartnotes
      - DB_PASSWORD=mysmartnotespassword
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=mysmartnotes
      - ENVIRONMENT=development
      - SECRET_KEY=your-secret-key-change-in-production
      - GLOBAL_AI_PROVIDER=gemini
      - GLOBAL_GEMINI_API_KEY=your-gemini-api-key
      - GLOBAL_AI_MODEL=models/gemma-4-26b-a4b-it
      - GLOBAL_REASONING_LEVEL=low
      - DEBUG=True
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  nginx:
    image: nginx:alpine
    container_name: mysmartnotes_frontend
    depends_on:
      - api
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge
