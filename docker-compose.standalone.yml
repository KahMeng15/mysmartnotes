x-common-env: &common-env
  DB_USER: your-db-user
  DB_PASSWORD: your-db-password
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: your-db-name
  REDIS_URL: redis://redis:6379/0
  CACHE_TTL_SECONDS: 3600
  ENVIRONMENT: development
  SECRET_KEY: your-secret-key-change-in-production
  APP_ENCRYPTION_KEY: ""
  DEBUG: "True"
  LOG_LEVEL: INFO
  GLOBAL_AI_TIER1_PROVIDER: gemini
  GLOBAL_AI_TIER1_MODEL: models/gemma-4-31b-it
  GLOBAL_AI_TIER1_API_KEY: ""
  GLOBAL_AI_TIER1_REASONING_LEVEL: high
  GLOBAL_AI_TIER2_PROVIDER: gemini
  GLOBAL_AI_TIER2_MODEL: models/gemma-4-26b-a4b-it
  GLOBAL_AI_TIER2_API_KEY: ""
  GLOBAL_AI_TIER2_REASONING_LEVEL: high
  GLOBAL_AI_TIER3_PROVIDER: ollama
  GLOBAL_AI_TIER3_MODEL: gemma4:e2b
  GLOBAL_AI_TIER3_BASE_URL: http://10.0.0.10:30068
  GLOBAL_AI_TIER3_REASONING_LEVEL: low

services:
  db:
    image: postgres:15-alpine
    container_name: mysmartnotes_db
    environment:
      POSTGRES_USER: your-db-user
      POSTGRES_PASSWORD: your-db-password
      POSTGRES_DB: your-db-name
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mysmartnotes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysmartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mysmartnotes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mysmartnotes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    platform: linux/amd64
    user: "${PUID:-568}:${PGID:-568}"
    build:
      context: .
      args:
        - USER_ID=${PUID:-568}
        - GROUP_ID=${PGID:-568}
    image: ghcr.io/kahmeng15/mysmartnotes:dev
    container_name: mysmartnotes_api
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      PORT: 8000
      CORS_ALLOWED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
      CSRF_COOKIE_NAME: csrf_token
      CSRF_HEADER_NAME: X-CSRF-Token
      TASK_RETENTION_DAYS: 14
      ADMIN_EMAIL: admin@example.com
      HOST: 0.0.0.0
      MAX_UPLOAD_SIZE_MB: 50
      FIREBASE_API_KEY: your-firebase-api-key
      FIREBASE_AUTH_DOMAIN: your-project-id.firebaseapp.com
      FIREBASE_PROJECT_ID: your-project-id
      FIREBASE_STORAGE_BUCKET: your-project-id.firebasestorage.app
      FIREBASE_MESSAGING_SENDER_ID: your-sender-id
      FIREBASE_APP_ID: your-app-id
      FIREBASE_MEASUREMENT_ID: your-measurement-id
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  worker:
    platform: linux/amd64
    user: "${PUID:-568}:${PGID:-568}"
    build:
      context: .
      args:
        - USER_ID=${PUID:-568}
        - GROUP_ID=${PGID:-568}
    image: ghcr.io/kahmeng15/mysmartnotes:dev
    container_name: mysmartnotes_worker
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  nginx:
    image: nginx:alpine
    container_name: mysmartnotes_frontend
    depends_on:
      - api
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge
