version: "3.8"

services:
  app:
    build: .
    container_name: mysmartnotes
    ports:
      - "${PORT}:${PORT}"
    environment:
      - PORT=${PORT}
      - DATABASE_URL=sqlite:///./data/app.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AI_PROVIDER=${AI_PROVIDER:-gemini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - FIREBASE_API_KEY=${FIREBASE_API_KEY:-}
      - FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN:-}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID:-mysmartnotes-965fe}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET:-}
      - FIREBASE_MESSAGING_SENDER_ID=${FIREBASE_MESSAGING_SENDER_ID:-}
      - FIREBASE_APP_ID=${FIREBASE_APP_ID:-}
      - FIREBASE_MEASUREMENT_ID=${FIREBASE_MEASUREMENT_ID:-}
      - GLOBAL_AI_PROVIDER=${GLOBAL_AI_PROVIDER:-gemini}
      - GLOBAL_GEMINI_API_KEY=${GLOBAL_GEMINI_API_KEY:-}
      - GLOBAL_HUGGINGFACE_TOKEN=${GLOBAL_HUGGINGFACE_TOKEN:-}
      - GLOBAL_AI_MODEL=${GLOBAL_AI_MODEL:-}
    volumes:
      - ./data:/app/data
      - ./app:/app/app
      - ./generated:/app/generated
      - ./output:/app/output
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge
