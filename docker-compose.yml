version: "3.8"

services:
  app:
    build: .
    container_name: mysmartnotes
    user: "0:0"
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PYTHONPATH=.
      - PORT=${PORT:-8000}
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
      - ./output:/app/output
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge
