services:
  db:
    image: postgres:15-alpine
    container_name: mysmartnotes_db
    environment:
      POSTGRES_USER: mysmartnotes
      POSTGRES_PASSWORD: mysmartnotespassword
      POSTGRES_DB: mysmartnotes
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mysmartnotes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysmartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mysmartnotes_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - mysmartnotes-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kahmeng15/mysmartnotes:latest
    container_name: mysmartnotes_api
    command: ["python", "-m", "app.main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8000
      - DB_USER=mysmartnotes
      - DB_PASSWORD=mysmartnotespassword
      - DB_HOST=db
      - DB_NAME=mysmartnotes
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  worker:
    image: ghcr.io/kahmeng15/mysmartnotes:latest
    container_name: mysmartnotes_worker
    command: ["python", "-m", "app.worker_main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DB_USER=mysmartnotes
      - DB_PASSWORD=mysmartnotespassword
      - DB_HOST=db
      - DB_NAME=mysmartnotes
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

  nginx:
    image: nginx:alpine
    container_name: mysmartnotes_frontend
    depends_on:
      - api
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge


