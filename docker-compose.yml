version: "3.8"

services:
  app:
    image: ghcr.io/kahmeng15/mysmartnotes:latest
    container_name: mysmartnotes
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8000}
    volumes:
      - ./data:/app/data
      - ./generated:/app/generated
      - ./output:/app/output
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - mysmartnotes-net

networks:
  mysmartnotes-net:
    driver: bridge
