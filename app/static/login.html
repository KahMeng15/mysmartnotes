<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        async function initFirebase() {
            try {
                const res = await fetch('/auth/firebase-config');
                if (res.ok) {
                    const firebaseConfig = await res.json();
                    const app = initializeApp(firebaseConfig);
                    const auth = getAuth(app);
                    const googleProvider = new GoogleAuthProvider();
                    googleProvider.setCustomParameters({
                        prompt: 'select_account'
                    });

                    window.firebaseAuth = auth;
                    window.googleProvider = googleProvider;
                    window.signInWithPopup = signInWithPopup;
                } else {
                    console.error("Failed to load Firebase config from backend.");
                }
            } catch (error) {
                console.error("Error fetching Firebase config:", error);
            }
        }

        initFirebase();
    </script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">
    <div class="auth-left">
        <div class="quote-container" id="quoteContainer">
            <div class="quote-text-wrapper">
                <div class="quote-mark open-mark">"</div>
                <div class="quote-text" id="quoteText"></div>
                <div class="quote-mark close-mark">"</div>
            </div>
            <div class="quote-author" id="quoteAuthor"></div>
        </div>
    </div>

    <div class="auth-right">
        <div class="sidebar-brand" style="font-size: 3rem;">my<br>smart<br>notes</div>

        <!-- Login Panel -->
        <div class="panel active" id="loginPanel">
            <div id="loginMsg" class="message-box"></div>
            <div class="form-group">
                <label class="form-label" for="loginEmail">Email</label>
                <input class="form-input" type="email" id="loginEmail" placeholder="you@example.com"
                    autocomplete="email">
            </div>
            <div class="form-group" id="loginPasswordGroup" style="display:none;">
                <label class="form-label" for="loginPassword">Password</label>
                <input class="form-input" type="password" id="loginPassword" placeholder="••••••••"
                    autocomplete="current-password">
            </div>
            <div class="btn-row" id="loginStep1Btns">
                <button class="btn btn-google" onclick="handleGoogleSignIn()">
                    <svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                    </svg>
                    Sign in with Google
                </button>
                <button class="btn btn-next" onclick="showPasswordField()">Next</button>
            </div>
            <div style="display:none;" id="loginStep2Btns">
                <button class="btn btn-next btn-block" onclick="handleLogin()">Sign In</button>
            </div>
            <p class="toggle-link">Don't have an account? <a onclick="switchPanel('register')">Sign up</a></p>
        </div>

        <!-- Register Panel -->
        <div class="panel" id="registerPanel">
            <div id="registerMsg" class="message-box"></div>
            <div class="form-group">
                <label class="form-label" for="regNickname">Nickname</label>
                <input class="form-input" type="text" id="regNickname" placeholder="What should we call you?">
            </div>
            <div class="form-group">
                <label class="form-label" for="regEmail">Email</label>
                <input class="form-input" type="email" id="regEmail" placeholder="you@example.com">
            </div>
            <div class="form-group">
                <label class="form-label" for="regPassword">Password</label>
                <input class="form-input" type="password" id="regPassword" placeholder="••••••••">
            </div>
            <button class="btn btn-next btn-block" style="margin-top:24px;" onclick="handleRegister()">Create
                Account</button>
            <p class="toggle-link">Already have an account? <a onclick="switchPanel('login')">Sign in</a></p>
        </div>

        <!-- Google Registration Panel -->
        <div class="panel" id="googleRegisterPanel">
            <div id="googleRegisterMsg" class="message-box"></div>
            <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Complete Your Profile</h2>
            <p style="color: #75757A; margin-bottom: 24px; font-size: 0.9rem;">Let's get your account set up!</p>
            <form id="googleRegisterForm" onsubmit="handleGoogleComplete(event)">
                <div class="form-group">
                    <label class="form-label" for="googleEmail">Email</label>
                    <input class="form-input" type="email" id="googleEmail" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label" for="googleFullName">Full Name</label>
                    <input class="form-input" type="text" id="googleFullName" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label" for="googleNickname">Nickname</label>
                    <input class="form-input" type="text" id="googleNickname" placeholder="What should we call you?"
                        required>
                </div>
                <button type="submit" class="btn btn-next btn-block" style="margin-top:24px;">Create Account</button>
                <p class="toggle-link">Changed your mind? <a onclick="closeGoogleRegisterModal()">Cancel</a></p>
            </form>
        </div>
    </div>

    <script>
        function switchPanel(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.getElementById(name + 'Panel').classList.add('active');
        }

        function showMessageBox(id, type, text) {
            const el = document.getElementById(id);
            el.className = 'message-box ' + type;
            el.textContent = text;
        }

        function showPasswordField() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showMessageBox('loginMsg', 'error', 'Please enter your email first.');
                return;
            }
            document.getElementById('loginPasswordGroup').style.display = 'block';
            document.getElementById('loginStep1Btns').style.display = 'none';
            document.getElementById('loginStep2Btns').style.display = 'block';
            document.getElementById('loginPassword').focus();
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            if (!email || !password) {
                showMessageBox('loginMsg', 'error', 'Please enter your email and password.');
                return;
            }
            try {
                const res = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    showMessageBox('loginMsg', 'success', 'Welcome back! Redirecting…');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
                } else {
                    const err = await res.json();
                    showMessageBox('loginMsg', 'error', err.detail || 'Login failed. Please check your credentials.');
                }
            } catch (e) {
                showMessageBox('loginMsg', 'error', 'Connection error. Please try again.');
            }
        }

        async function handleRegister() {
            const nickname = document.getElementById('regNickname').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            if (!nickname || !email || !password) {
                showMessageBox('registerMsg', 'error', 'All fields are required.');
                return;
            }
            try {
                const res = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nickname, email, password })
                });
                if (res.ok) {
                    showMessageBox('registerMsg', 'success', 'Account created! Please sign in.');
                    setTimeout(() => switchPanel('login'), 1500);
                } else {
                    const err = await res.json();
                    showMessageBox('registerMsg', 'error', err.detail || 'Registration failed.');
                }
            } catch (e) {
                showMessageBox('registerMsg', 'error', 'Connection error. Please try again.');
            }
        }

        async function handleGoogleSignIn() {
            try {
                // Wait a moment for Firebase to initialize
                if (!window.firebaseAuth || !window.googleProvider) {
                    setTimeout(handleGoogleSignIn, 500);
                    return;
                }

                const result = await window.signInWithPopup(window.firebaseAuth, window.googleProvider);
                const user = result.user;
                const idToken = await user.getIdToken();

                // Send token to backend to verify
                const res = await fetch('/auth/google-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken })
                });

                if (res.ok) {
                    const data = await res.json();

                    if (data.is_new_user) {
                        // New user - show registration modal
                        window.googleIdToken = idToken; // Store for later
                        showGoogleRegisterModal(data);
                    } else {
                        // Existing user - log them in
                        localStorage.setItem('token', data.access_token);
                        if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                        showMessageBox('loginMsg', 'success', 'Welcome back! Redirecting…');
                        setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
                    }
                } else {
                    const err = await res.json();
                    showMessageBox('loginMsg', 'error', err.detail || 'Google sign-in failed.');
                    // Sign out from Firebase if backend failed
                    window.firebaseAuth.signOut();
                }
            } catch (e) {
                if (e.code === 'auth/popup-closed-by-user') {
                    // User closed the popup, no error message needed
                } else if (e.code === 'auth/popup-blocked') {
                    showMessageBox('loginMsg', 'error', 'Pop-up blocked. Please allow pop-ups for this site.');
                } else {
                    console.error('Google Sign-In error:', e);
                    showMessageBox('loginMsg', 'error', 'Google sign-in failed. Please try again.');
                }
            }
        }

        function showGoogleRegisterModal(data) {
            document.getElementById('googleEmail').value = data.email;
            document.getElementById('googleFullName').value = data.full_name || '(not provided)';
            document.getElementById('googleNickname').value = data.suggested_nickname || '';
            switchPanel('googleRegister');
            document.getElementById('googleNickname').focus();
        }

        function closeGoogleRegisterModal() {
            switchPanel('login');
            window.googleIdToken = null;
            // Sign out from Firebase when closing panel
            if (window.firebaseAuth) {
                window.firebaseAuth.signOut();
            }
        }

        async function handleGoogleComplete(event) {
            event.preventDefault();

            if (!window.googleIdToken) {
                showMessageBox('loginMsg', 'error', 'Session expired. Please try again.');
                closeGoogleRegisterModal();
                return;
            }

            const nickname = document.getElementById('googleNickname').value.trim();
            if (!nickname) {
                showMessageBox('googleRegisterMsg', 'error', 'Please enter a nickname.');
                return;
            }

            try {
                const res = await fetch('/auth/google-complete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ idToken: window.googleIdToken, nickname })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('token', data.access_token);
                    if (data.user) localStorage.setItem('user', JSON.stringify(data.user));
                    showMessageBox('googleRegisterMsg', 'success', 'Welcome! Redirecting…');
                    setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
                } else {
                    const err = await res.json();
                    showMessageBox('googleRegisterMsg', 'error', err.detail || 'Registration failed.');
                }
            } catch (e) {
                console.error('Google registration error:', e);
                showMessageBox('googleRegisterMsg', 'error', 'An error occurred. Please try again.');
            }
        }

        // Allow Enter key to advance form
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginPanel').classList.contains('active')) {
                    if (document.getElementById('loginStep2Btns').style.display === 'block') {
                        handleLogin();
                    } else {
                        showPasswordField();
                    }
                } else {
                    handleRegister();
                }
            }
        });
    </script>
    <script src="js/quotes.js"></script>
</body>

</html>

</html>
