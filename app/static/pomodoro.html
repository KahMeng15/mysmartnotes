<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/pomodoro.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/quotes.js"></script>
</head>

<body class="pomodoro-page">
    <div class="pomodoro-container">
        <!-- Main Timer Section -->
        <div class="timer-section card">
            <div class="timer-header">
                <div class="timer-modes">
                    <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                    <button class="mode-btn" data-mode="short_break">Short Break</button>
                    <button class="mode-btn" data-mode="long_break">Long Break</button>
                    <button class="mode-btn" data-mode="stopwatch">Stopwatch</button>
                </div>
                <button class="btn-icon" id="settingsBtn" title="Timer Settings"><i class="ph ph-sliders"></i></button>
            </div>

            <div class="timer-display" id="timerDisplay">25:00</div>
            
            <div class="timer-controls">
                <button id="startBtn" class="btn btn-primary btn-lg"><i class="ph ph-play"></i> START</button>
                <button id="pauseBtn" class="btn btn-outline btn-lg" style="display:none;"><i class="ph ph-pause"></i> PAUSE</button>
                <button id="resetBtn" class="btn btn-outline"><i class="ph ph-arrows-clockwise"></i></button>
                <button id="popoutBtn" class="btn btn-outline" title="Popout Window"><i class="ph ph-arrow-square-out"></i></button>
            </div>

            <!-- Custom Time Inputs (Hidden by default) -->
            <div id="customTimeSection" style="display:none; margin-top:20px; border-top: 1px solid var(--color-light-gray); padding-top:20px;">
                <div style="display:flex; justify-content:center; gap:10px; align-items:center; margin-bottom:10px;">
                    <input type="number" id="customMins" placeholder="Mins" min="1" max="999" style="width:70px; padding:5px;">
                    <span>:</span>
                    <input type="number" id="customSecs" placeholder="Secs" min="0" max="59" value="00" style="width:60px; padding:5px;">
                    <button class="btn btn-primary btn-small" id="applyTimeBtn">Apply</button>
                    <button class="btn btn-outline btn-small" id="saveDefaultBtn" title="Save as Default"><i class="ph ph-floppy-disk"></i></button>
                </div>
                <small style="color:var(--color-gray)">Set duration for current mode</small>
            </div>

            <div class="timer-context">
                <label for="lectureSelect">Studying:</label>
                <select id="lectureSelect">
                    <option value="">General Study</option>
                </select>
            </div>
        </div>

        <!-- Motivation & Progress -->
        <div class="stats-row">
            <div class="card motivation-card" id="quoteContainer">
                <p id="quoteText">"The best way to predict your future is to create it."</p>
                <small id="quoteAuthor">- Abraham Lincoln</small>
            </div>
            
            <div class="card goals-card">
                <h3>Today's Focus</h3>
                <div class="goals-grid">
                    <div class="goal-item">
                        <span class="goal-value" id="todayPomos">0</span>
                        <span class="goal-label">Pomodoros</span>
                    </div>
                    <div class="goal-item">
                        <span class="goal-value" id="todayMinutes">0m</span>
                        <span class="goal-label">Study Time</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Study Calendar -->
        <div class="card calendar-card">
            <div class="calendar-header">
                <h3>Study Activity (Last 30 Days)</h3>
                <div class="calendar-legend">
                    <span>Less</span>
                    <div class="legend-box level-0"></div>
                    <div class="legend-box level-1"></div>
                    <div class="legend-box level-2"></div>
                    <div class="legend-box level-3"></div>
                    <div class="legend-box level-4"></div>
                    <span>More</span>
                </div>
            </div>
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS will populate -->
            </div>
            <div id="calendarTooltip" class="calendar-tooltip"></div>
        </div>
    </div>

    <audio id="timerEndSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <script src="/js/pomodoro.js"></script>
</body>

</html>
