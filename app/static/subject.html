<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Details - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/subject.js"></script>
    <script src="/js/footer.js"></script>
</head>

<body>

    <div class="page-card">
        <!-- Sticky Navigation Header -->
        <div class="note-sticky-header">
            <div class="note-nav-back">
                <span id="breadcrumbGroup" style="display: none;">
                    <a id="groupLink" href="#"></a>
                </span>
            </div>
        </div>

        <!-- Sticky Header Section -->
        <div class="page-card-header">
            <!-- Header -->
            <div class="page-header-row">
                <div>
                    <h1 id="subjectTitle">Loading Subject...</h1>
                    <p id="subjectDesc" style="color: var(--color-gray); margin-bottom: 0;"></p>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="openEditSubjectModal()" class="btn btn-outline">
                        <i class="ph ph-pencil-simple"></i> Edit
                    </button>
                    <button onclick="goToUpload()" class="btn btn-primary">
                        <i class="ph ph-upload-simple"></i> Upload
                    </button>
                    <button onclick="deleteSubject()" class="btn btn-text" style="color: var(--color-error);">
                        <i class="ph ph-trash"></i> Delete
                    </button>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search lectures..." onkeyup="filterLectures()">
                </div>
                <select id="sortSelect" class="form-control" onchange="filterLectures()">
                    <option value="recent">Most Recent</option>
                    <option value="oldest">Oldest First</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
        </div>

        <div class="page-card-content" style="padding-top: var(--spacing-md);">
            <!-- Lecture List Container -->
            <div class="group-section">
                <div id="lecturesList" class="lecture-list">
                    <div class="empty-state">
                        <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                        <p>Loading lectures...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Subject Modal -->
    <div id="editSubjectModal" class="modal">
        <div class="modal-content">
            <h2>Edit Subject</h2>
            <form onsubmit="handleEditSubject(event)">
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="editSubjectNameInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editSubjectDescInput" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Color Tag</label>
                    <input type="color" id="editSubjectColorInput" class="form-control"
                        style="height: 40px; padding: 0; border: none;">
                </div>

                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <button type="button" onclick="closeModal('editSubjectModal')" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
