<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject Details - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        .group-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
            border: 1px solid var(--color-light-gray);
        }

        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-md);
            border-bottom: 2px solid var(--color-light-gray);
        }

        .group-title {
            font-size: var(--font-size-xl);
            font-weight: 700;
            color: var(--color-text);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .group-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        /* List View Styles */
        .lecture-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .lecture-item {
            background: var(--color-background);
            border: 1px solid var(--color-light-gray);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all var(--transition-base);
        }

        .lecture-item:hover {
            transform: translateX(4px);
            border-color: var(--color-primary);
            box-shadow: var(--shadow-sm);
        }

        .lecture-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex: 1;
            cursor: pointer;
        }

        .lecture-icon {
            width: 40px;
            height: 40px;
            background: var(--color-white);
            color: var(--color-primary);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid var(--color-light-gray);
        }

        .lecture-details h4 {
            margin: 0;
            font-size: var(--font-size-base);
            font-weight: 600;
        }

        .lecture-details p {
            margin: 0;
            font-size: var(--font-size-sm);
            color: var(--color-gray);
        }

        .lecture-actions {
            display: flex;
            gap: var(--spacing-sm);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: var(--color-gray);
            background: var(--color-background);
            border-radius: var(--radius-lg);
            border: 1px dashed var(--color-light-gray);
        }

        /* Controls bar styling from notes.html */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-lg);
            padding-left: 45px;
            border: 1px solid var(--color-light-gray);
            border-radius: var(--radius-full);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-box input:focus {
            border-color: var(--color-primary);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-gray);
            font-size: 20px;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="notes.html" class="navbar-brand"><i class="ph ph-books"></i> MySmartNotes</a>
                <ul class="navbar-nav">
                    <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                    <li><a href="notes.html" class="nav-link active">My Notes</a></li>
                    <li><a href="chat.html" class="nav-link">Chat</a></li>
                    <li><a href="settings.html" class="nav-link">Settings</a></li>
                </ul>
                <div class="avatar" onclick="logout()"><i class="ph ph-user-circle"></i></div>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: var(--spacing-2xl);">
        <!-- Back Link -->
        <div style="margin-bottom: var(--spacing-md);">
            <a href="notes.html" id="backLink"
                style="color: var(--color-gray); font-size: var(--font-size-sm); text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                <i class="ph ph-arrow-left"></i> Back to Notes
            </a>
        </div>

        <!-- Main Header (Like My Notes) -->
        <div class="d-flex justify-content-between align-items-center" style="margin-bottom: var(--spacing-xl);">
            <div>
                <h1 id="subjectTitle" style="margin-bottom: var(--spacing-xs);">Loading Subject...</h1>
                <p id="subjectDesc" style="color: var(--color-gray); margin-bottom: 0;"></p>
            </div>
            <div class="d-flex gap-2">
                <button onclick="openEditSubjectModal()" class="btn btn-outline">
                    <i class="ph ph-pencil-simple"></i> Edit
                </button>
                <button onclick="goToUpload()" class="btn btn-primary">
                    <i class="ph ph-upload-simple"></i> Upload
                </button>
                <button onclick="deleteSubject()" class="btn btn-text" style="color: var(--color-error);">
                    <i class="ph ph-trash"></i> Delete
                </button>
            </div>
        </div>

        <!-- Controls (Like match notes.html) -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="ph ph-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search lectures..." onkeyup="filterLectures()">
            </div>
            <select id="sortSelect" class="form-control" style="width: auto;" onchange="filterLectures()">
                <option value="recent">Most Recent</option>
                <option value="oldest">Oldest First</option>
                <option value="name">Name (A-Z)</option>
            </select>
        </div>

        <!-- Lecture List Container (White Box) -->
        <div class="group-section">
            <!-- Lecture List -->
            <div id="lecturesList" class="lecture-list">
                <div class="empty-state">
                    <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                    <p>Loading lectures...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Subject Modal -->
    <div id="editSubjectModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Edit Subject</h2>
                <button class="modal-close" onclick="closeModal('editSubjectModal')">&times;</button>
            </div>
            <form onsubmit="handleEditSubject(event)">
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="editSubjectNameInput" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="editSubjectDescInput" class="form-control" rows="3"></textarea>
                </div>
                <!-- Simplified Color Picker (optional, backend supports it) -->
                <div class="form-group">
                    <label>Color Tag</label>
                    <input type="color" id="editSubjectColorInput" class="form-control" style="height: 40px;">
                </div>

                <div class="d-flex justify-content-end gap-2 mt-5">
                    <button type="button" onclick="closeModal('editSubjectModal')"
                        class="btn btn-outline">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        let allLectures = [];
        let currentSubject = null;

        window.addEventListener('load', () => {
            if (!token) window.location.href = 'index.html';
            if (!subjectId) {
                alert('No subject specified');
                window.location.href = 'notes.html';
                return;
            }
            loadSubjectDetails();
            loadLectures();
        });

        async function loadSubjectDetails() {
            try {
                // Determine group context? We can just fetch subjects to find this one.
                const response = await fetch(`${API_URL}/subjects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    const subjects = await response.json();
                    currentSubject = subjects.find(s => s.id == subjectId);
                    if (currentSubject) {
                        document.getElementById('subjectTitle').textContent = currentSubject.name;
                        document.getElementById('subjectDesc').textContent = currentSubject.description || '';

                        // Update Path/Back Link
                        const backLink = document.getElementById('backLink');
                        if (currentSubject.group_id) {
                            backLink.href = `group.html?id=${currentSubject.group_id}`;
                            backLink.innerHTML = `<i class="ph ph-arrow-left"></i> Back to Group`;
                        } else {
                            backLink.href = 'notes.html';
                            backLink.innerHTML = `<i class="ph ph-arrow-left"></i> Back to Notes`;
                        }
                    } else {
                        document.getElementById('subjectTitle').textContent = 'Subject Not Found';
                        document.querySelector('.group-actions').style.display = 'none';
                    }
                }
            } catch (error) {
                console.error('Error loading subject:', error);
            }
        }

        async function loadLectures() {
            try {
                const response = await fetch(`${API_URL}/lectures?subject_id=${subjectId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    let data = await response.json();
                    allLectures = data.filter(l => l.subject_id == subjectId);
                    displayLectures(allLectures);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('lecturesList').innerHTML = '<div class="empty-state">Error loading lectures</div>';
            }
        }

        function filterLectures() {
            let filtered = allLectures;
            const search = document.getElementById('searchInput').value.toLowerCase();
            if (search) {
                filtered = filtered.filter(l => l.title.toLowerCase().includes(search));
            }

            const sort = document.getElementById('sortSelect').value;
            if (sort === 'recent') {
                filtered.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            } else if (sort === 'oldest') {
                filtered.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            } else if (sort === 'name') {
                filtered.sort((a, b) => a.title.localeCompare(b.title));
            }

            displayLectures(filtered);
        }

        function displayLectures(lectures) {
            const listContainer = document.getElementById('lecturesList');
            if (!lectures || lectures.length === 0) {
                listContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="ph ph-files" style="font-size: 48px; margin-bottom: 1rem;"></i>
                        <p>No lectures found in this subject.</p>
                        <button onclick="goToUpload()" class="btn btn-primary" style="margin-top: 1rem;">Upload First Lecture</button>
                    </div>
                `;
                return;
            }

            listContainer.innerHTML = lectures.map(lecture => `
                <div class="lecture-item">
                    <div class="lecture-info" onclick="openLecture(${lecture.id})" style="cursor: pointer;">
                        <div class="lecture-icon">
                            <i class="ph ${getIconForType(lecture.file_type)}"></i>
                        </div>
                        <div class="lecture-details">
                            <h4>${lecture.title}</h4>
                            <p>${new Date(lecture.created_at).toLocaleDateString()} • ${lecture.file_type ? lecture.file_type.split('/')[1].toUpperCase() : 'FILE'}</p>
                        </div>
                    </div>
                    <div class="lecture-actions">
                        <button onclick="openLecture(${lecture.id})" class="btn btn-outline btn-small">
                            View
                        </button>
                        <button onclick="deleteLecture(${lecture.id})" class="btn btn-text btn-small" style="color: var(--color-error);">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function getIconForType(mimeType) {
            if (!mimeType) return 'ph-file';
            if (mimeType.includes('pdf')) return 'ph-file-pdf';
            if (mimeType.includes('image')) return 'ph-file-image';
            if (mimeType.includes('presentation') || mimeType.includes('powerpoint')) return 'ph-presentation';
            return 'ph-file-text';
        }

        function openLecture(id) {
            window.location.href = `lecture-view.html?id=${id}`;
        }

        function goToUpload() {
            // Need group info? We can get it from currentSubject.group_id
            let url = `upload.html?subject_id=${subjectId}`;
            if (currentSubject && currentSubject.group_id) {
                url += `&group_id=${currentSubject.group_id}`;
            }
            window.location.href = url;
        }

        // --- Edit Subject Logic ---
        function openEditSubjectModal() {
            if (!currentSubject) return;
            document.getElementById('editSubjectModal').classList.add('show');
            document.getElementById('editSubjectNameInput').value = currentSubject.name;
            document.getElementById('editSubjectDescInput').value = currentSubject.description || '';
            document.getElementById('editSubjectColorInput').value = currentSubject.color || '#3b82f6';
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        async function handleEditSubject(e) {
            e.preventDefault();
            const name = document.getElementById('editSubjectNameInput').value;
            const desc = document.getElementById('editSubjectDescInput').value;
            const color = document.getElementById('editSubjectColorInput').value;

            try {
                const res = await fetch(`${API_URL}/subjects/${subjectId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        description: desc,
                        color,
                    })
                });

                if (res.ok) {
                    closeModal('editSubjectModal');
                    loadSubjectDetails(); // Reload details
                } else {
                    alert('Failed to update subject');
                }
            } catch (err) {
                alert('Error updating subject');
            }
        }

        async function deleteSubject() {
            if (!confirm('Are you sure you want to delete this subject? All lectures within it will also be deleted.')) return;
            try {
                const response = await fetch(`${API_URL}/subjects/${subjectId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    alert('Subject deleted successfully');
                    window.location.href = 'notes.html';
                } else {
                    alert('Failed to delete subject');
                }
            } catch (error) {
                alert('Error deleting subject');
            }
        }

        async function deleteLecture(id) {
            if (!confirm('Delete this lecture?')) return;
            try {
                const response = await fetch(`${API_URL}/lectures/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (response.ok) {
                    loadLectures();
                }
            } catch (error) {
                alert('Error deleting lecture');
            }
        }

        function logout() {
            if (confirm('Logout?')) {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            }
        }

        // Close modal on outside click
        window.onclick = function (event) {
            if (event.target.classList.contains('modal-overlay')) {
                event.target.classList.remove('show');
            }
        }
    </script>
</body>

</html>
