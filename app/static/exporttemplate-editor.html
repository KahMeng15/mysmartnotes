<!DOCTYPE html>
<html lang="en">

<head>

<body>

                                <div class="setting-row">
                                    <label>Orientation</label>

                                    </select>
                                </div>
                                <div class="setting-row">
                                    <label>Columns</label>
                                    <select id="cfgColumns" onchange="markDirty(); updatePreview();">

                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </div>
                                <div class="setting-row">
                                    <label>Margin Top (mm)</label>
                                    <input type="number" id="cfgMarginTop" step="1" min="0" max="80" value="25"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Margin Bottom (mm)</label>
                                    <input type="number" id="cfgMarginBottom" step="1" min="0" max="80" value="25"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Margin Left (mm)</label>
                                    <input type="number" id="cfgMarginLeft" step="1" min="0" max="80" value="19"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Margin Right (mm)</label>
                                    <input type="number" id="cfgMarginRight" step="1" min="0" max="80" value="19"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                </div>
                            </div>

                            <!-- Code Blocks -->
                            <div class="settings-group">
                                <h4><i class="ph ph-code"></i> Code Blocks</h4>
                                <div class="group-content">
                                    <div class="setting-row">
                                        <label>Font Size</label>
                                        <input type="number" id="cfgCodeFontSize" value="10" min="6" max="24" onchange="markDirty(); updatePreview();">

                                    <div class="setting-row">
                                        <label>Text Color</label>

                                    </div>
                                    <div class="setting-row">
                                        <label>Background</label>
                                        <input type="color" id="cfgCodeBgColor" value="#f8f9fa" onchange="markDirty(); updatePreview();">

                                </div>
                            </div>

                            <!-- Tables -->
                            <div class="settings-group">
                                <h4><i class="ph ph-table"></i> Tables</h4>
                                <div class="group-content">
                                    <div class="setting-row">
                                        <label>Header BG</label>
                                        <input type="color" id="cfgTableHeadBg" value="#593f8f" onchange="markDirty(); updatePreview();">
                                    </div>
                                    <div class="setting-row">
                                        <label>Header Text</label>

                                    <div class="setting-row">
                                        <label>Odd Row</label>

                                    </div>
                                </div>
                            </div>

                            <!-- Spacing -->
                            <div class="settings-group">
                                <h4><i class="ph ph-arrows-out-line"></i> Spacing</h4>
                                <div class="group-content">
                                <div class="setting-row">
                                    <label>Line Spacing</label>

                                    <input type="number" id="cfgParagraphSpacing" step="1" min="0" max="30" value="8"

                                </div>
                            </div>

                            <!-- List Spacing -->
                            <div class="settings-group">
                                <h4><i class="ph ph-list"></i> List Spacing</h4>
                                <div class="group-content">
                                <div class="setting-row">
                                    <label>Left Margin (pt)</label>
                                    <input type="number" id="cfgListLeftMargin" step="1" min="0" max="60" value="24"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Bullet-Text Gap (pt)</label>
                                    <input type="number" id="cfgListBulletGap" step="1" min="2" max="30" value="6"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Numbered List Format</label>
                                    <select id="cfgNumFormat" onchange="markDirty(); updatePreview();">
                                        <option value="1.">1.</option>

                                <div class="setting-row">
                                        <label>Bullet Style</label>
                                        <div style="width: 120px;">
                                            <select id="cfgCustomBulletPreset" onchange="handleBulletPresetChange(this.value)" style="width: 100%; box-sizing: border-box;">
                                                <option value="">-- Presets --</option>
                                                <option value="•">• Bullet</option>

                                                <option value="→">→ Arrow</option>
                                                <option value="✓">✓ Check</option>
                                                <option value="-">- Dash</option>
                                                <option value="custom" selected>Custom</option>
                                            </select>
                                            <input type="text" id="cfgCustomBullet" placeholder="Enter custom bullet" maxlength="3" value="•" onchange="markDirty(); updatePreview();" style="width: 100%; box-sizing: border-box; margin-top: 8px;">
                                        </div>

                            </div>

                            <div class="settings-group">

                                <div class="group-content">
                                <div class="setting-row">
                                    <label>Header BG</label>
                                    <input type="color" id="tbl_header_bg" value="#593f8f"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Header Text</label>
                                    <input type="color" id="tbl_header_fg" value="#ffffff"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Odd Row</label>
                                    <input type="color" id="tbl_odd_row" value="#ffffff"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Even Row</label>
                                    <input type="color" id="tbl_even_row" value="#f5f4fb"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Border Color</label>
                                    <input type="color" id="tbl_border_color" value="#cccccc"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Border Width (pt)</label>
                                    <input type="number" id="tbl_border_width" step="0.5" min="0" max="5" value="0.5"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Repeat Header</label>
                                    <div class="mini-toggle active" id="tbl_repeat_header"
                                        onclick="this.classList.toggle('active'); markDirty(); updatePreview();"></div>
                                </div>
                                <div class="setting-row">
                                    <label>Cell Padding (pt)</label>
                                    <input type="number" id="tbl_cell_padding" step="1" min="0" max="20" value="6"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Header Font (pt)</label>
                                    <input type="number" id="tbl_header_fs" step="1" min="6" max="20" value="10"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Body Font (pt)</label>
                                    <input type="number" id="tbl_body_fs" step="1" min="6" max="20" value="9"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Alignment</label>
                                    <select id="tbl_alignment" onchange="markDirty(); updatePreview();">
                                        <option value="left">Left</option>
                                        <option value="center">Center</option>
                                        <option value="right">Right</option>
                                    </select>
                                </div>
                                </div>
                            </div>

                            <!-- Cover Page -->
                            <div class="settings-group">
                                <h4><i class="ph ph-book-open"></i> Cover Page</h4>
                                <div class="group-content">
                                <div class="setting-row">

                                    <div class="mini-toggle active" id="cfgCoverEnabled"
                                        onclick="this.classList.toggle('active'); markDirty(); updatePreview();"></div>
                                </div>
                                <div class="setting-row">

                                    <input type="text" id="cfgCoverH1Text" placeholder="Sample Document Title" oninput="markDirty(); updatePreview();" class="standard-input">

                                <div class="setting-row">
                                    <label>H1 Size (pt)</label>
                                    <input type="number" id="cfgCoverTitleSize" min="20" max="60" value="36"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>H1 Color</label>
                                    <input type="color" id="cfgCoverTitleColor" value="#1A1A2E"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>H2 Text</label>
                                    <input type="text" id="cfgCoverH2Text" placeholder="Subject Name" oninput="markDirty(); updatePreview();" class="standard-input">
                                </div>
                                <div class="setting-row">
                                    <label>H2 Size (pt)</label>
                                    <input type="number" id="cfgCoverH2Size" min="10" max="40" value="14"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>H2 Color</label>
                                    <input type="color" id="cfgCoverH2Color" value="#7f8c8d"
                                        onchange="markDirty(); updatePreview();">
                                </div>
                                <div class="setting-row">
                                    <label>Horizontal Align</label>
                                    <select id="cfgCoverHAlign" onchange="markDirty(); updatePreview();">
                                        <option value="left">Left</option>
                                        <option value="center" selected>Center</option>
                                        <option value="right">Right</option>
                                    </select>
                                </div>
                                <div class="setting-row">
                                    <label>Vertical Align</label>
                                    <select id="cfgCoverVAlign" onchange="markDirty(); updatePreview();">
                                        <option value="top">Top</option>
                                        <option value="middle" selected>Middle</option>
                                        <option value="bottom">Bottom</option>
                                    </select>
                                </div>
                                <div class="setting-row">
                                    <label>Show Date</label>
                                    <div class="mini-toggle active" id="cfgCoverShowDate"
                                        onclick="this.classList.toggle('active'); markDirty(); updatePreview();"></div>
                                </div>
                                </div>
                            </div>

                            <!-- Header/Titles -->
                            <div class="settings-group">
                                <h4><i class="ph ph-text"></i> Header/Titles</h4>
                                <div class="group-content">
                                <div class="setting-row">
                                    <label>Show Note Title</label>
                                    <div class="mini-toggle active" id="cfgHeaderShowNoteTitle"
                                        onclick="this.classList.toggle('active'); markDirty(); updatePreview();"></div>
                                </div>
                                <div class="setting-row">
                                    <label>Show Subject Name</label>
                                    <div class="mini-toggle active" id="cfgHeaderShowSubjectName"
                                        onclick="this.classList.toggle('active'); markDirty(); updatePreview();"></div>
                                </div>
                                <div class="setting-row">
                                    <label>Show Group Name</label>

                            <!-- Footer -->

                                <h4><i class="ph ph-text-align-center"></i> Footer</h4>
                                <div class="group-content">
                                <div class="setting-row">

                        <!-- Sidebar Footer with Save Button -->
                        <div class="sidebar-footer">
                            <button class="btn btn-primary" onclick="saveTemplate()" id="saveBtn" style="flex: 1; padding: 10px 16px;">Save Template</button>
                            <button class="btn btn-secondary" onclick="closeEditor()" style="flex: 1; padding: 10px 16px;">Discard Changes</button>
                        </div>
                    </div>

                    <!-- Main Preview Area -->
                    <div class="chat-main template-preview-main">

                        <div class="preview-container">
                            <div class="preview-scroll-area" id="previewScrollArea">
                                <div class="preview-page" id="previewPage">
                                    <!-- Populated by JS -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Floating Zoom Control (bottom right) -->
                    <div class="floating-zoom-card">
                        <button class="zoom-btn-small" onclick="zoomOut()" title="Zoom Out"><i class="ph ph-minus"></i></button>
                        <span id="zoomLevel" class="zoom-level-display">100%</span>
                        <button class="zoom-btn-small" onclick="zoomIn()" title="Zoom In"><i class="ph ph-plus"></i></button>
                        <button class="zoom-btn-small" onclick="resetZoom()" title="Reset Zoom"><i class="ph ph-arrows-out"></i></button>
                        
                        <!-- Divider between zoom and page controls -->
                        <div style="width: 1px; height: 24px; background: var(--color-light-gray); margin: 0 4px;"></div>
                        
                        <!-- Page Selection Buttons (for cover pages) -->
                        <div id="pageSelectionCard" style="display: none; gap: var(--spacing-sm); align-items: center;">
                            <button class="page-btn" id="pageShowCover" onclick="showCoverPage()" title="View Cover"><i class="ph ph-book"></i> Cover</button>
                            <button class="page-btn active" id="pageShowContents" onclick="showContentsPage()" title="View Contents"><i class="ph ph-text"></i> Contents</button>
                        </div>
                    </div>
    </div>

    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        let templates = [];
        let selectedTemplateId = null;
        let isDirty = false;
        let currentTemplate = null;

        const ELEMENTS = ['note_title', 'subject_name', 'group_name', 'h1', 'h2', 'h3', 'h4', 'h5', 'paragraph', 'list'];
        const ELEMENT_LABELS = {
            note_title: 'Note Title',
            subject_name: 'Subject Name',
            group_name: 'Group Name',
            h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3',
            h4: 'Heading 4', h5: 'Heading 5',
            paragraph: 'Paragraph', list: 'List',
        };

        window.addEventListener('load', () => {
            if (!token) window.location.href = '/login';
            const parts = window.location.pathname.split('/');
            selectedTemplateId = parts[parts.length - 1]; // e.g. /exporttemplate/{id}
            if (selectedTemplateId && selectedTemplateId !== 'exporttemplate') {
                loadTemplate(selectedTemplateId);
            } else {
                window.location.href = '/exporttemplates';
            }
            
            // Add trackpad/scroll wheel zoom support
            document.addEventListener('wheel', (e) => {
                if (e.ctrlKey || e.metaKey) {
                    e.preventDefault();
                    if (e.deltaY < 0) {
                        zoomIn();
                    } else if (e.deltaY > 0) {
                        zoomOut();
                    }
                }
            }, { passive: false });
        });

        // ─── API ─────────────────────────────────────────────────

        async function loadTemplate(id) {
            try {
                const res = await fetch(`/templates/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const tmpl = await res.json();
                    currentTemplate = tmpl; // Store template data
                    
                    // Set name
                    const nameInput = document.getElementById('templateName');
                    if (nameInput) {
                        nameInput.value = tmpl.name;

                        // Disable editing for system templates
                        const isSystem = tmpl.is_system;
                        nameInput.readOnly = isSystem;
                        
                        // Only update saveBtn if it exists
                        const saveBtn = document.getElementById('saveBtn');
                        if (saveBtn) {
                            saveBtn.style.display = isSystem ? 'none' : '';
                        }
                    }

                    // Load config
                    loadConfig(tmpl.config);
                    buildElementStyles(tmpl.config);
                    updatePreview();
                } else {
                    alert('Failed to load template');
                    window.location.href = '/exporttemplates';
                }
            } catch (e) { console.error(e); alert('Error loading template: ' + e.message); }
        }

        async function saveTemplate() {
            if (!selectedTemplateId) return;
            if (!currentTemplate || currentTemplate.is_system) return;

            const config = gatherConfig();
            const name = document.getElementById('templateName').value.trim();
            if (!name) { alert('Template name is required'); return; }

            try {
                const res = await fetch(`/templates/${selectedTemplateId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, config })
                });
                if (res.ok) {
                    isDirty = false;
                    currentTemplate.name = name;
                    currentTemplate.config = config;
                    showSuccessModal('Template Saved', 'Your template has been saved successfully!');
                    setTimeout(() => { window.location.href = '/exporttemplates'; }, 1500);
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to save template');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function createNewTemplate() {
            const name = prompt('Template name:');
            if (!name) return;
            try {
                const res = await fetch('/templates', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    const newTmpl = await res.json();
                    window.location.href = `/exporttemplate/${newTmpl.id}`;
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to create template');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function duplicateSelectedTemplate() {
            if (!selectedTemplateId || !currentTemplate) return;
            try {
                const res = await fetch(`/templates/${selectedTemplateId}/duplicate`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const newTmpl = await res.json();
                    window.location.href = `/exporttemplate/${newTmpl.id}`;
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to duplicate template');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function deleteSelectedTemplate() {
            if (!selectedTemplateId || !currentTemplate) return;
            if (currentTemplate.is_system) return;
            if (!confirm(`Delete "${currentTemplate.name}"? This cannot be undone.`)) return;

            try {
                const res = await fetch(`/templates/${selectedTemplateId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    showSuccessModal('Template Deleted', 'Your template has been deleted successfully!');
                    setTimeout(() => { window.location.href = '/exporttemplates'; }, 1500);
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to delete template');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }



        function closeEditor() {
            if (isDirty) {
                showDiscardModal();
            } else {
                window.location.href = '/exporttemplates';
            }
        }

        function showDiscardModal() {
            document.getElementById('discardChangesModal').classList.add('active');
        }

        function closeDiscardModal() {
            document.getElementById('discardChangesModal').classList.remove('active');
        }

        function confirmDiscard() {
            window.location.href = '/exporttemplates';
        }



        function markDirty() {
            isDirty = true;
        }

        function handleBulletPresetChange(value) {
            const customInput = document.getElementById('cfgCustomBullet');
            const preset = document.getElementById('cfgCustomBulletPreset');
            
            if (value === 'custom') {
                // Show custom input
                customInput.style.display = '';
                customInput.focus();
            } else if (value !== '') {
                // Apply preset and hide custom input
                customInput.value = value;
                customInput.style.display = 'none';
                // Keep the preset selected in dropdown (don't reset it)
                markDirty();
                updatePreview();
            } else {
                // Hide custom input when "-- Presets --" is selected
                customInput.style.display = 'none';
            }
        }

        // ─── Config I/O ──────────────────────────────────────────

        function loadConfig(cfg) {
            // Page
            document.getElementById('cfgPageSize').value = cfg.page?.size || 'A4';
            document.getElementById('cfgOrientation').value = cfg.page?.orientation || 'portrait';
            document.getElementById('cfgColumns').value = cfg.page?.columns || 1;
            document.getElementById('cfgMarginTop').value = cfg.page?.margins?.top ?? 25;
            document.getElementById('cfgMarginBottom').value = cfg.page?.margins?.bottom ?? 25;
            document.getElementById('cfgMarginLeft').value = cfg.page?.margins?.left ?? 19;
            document.getElementById('cfgMarginRight').value = cfg.page?.margins?.right ?? 19;

            // Tables
            document.getElementById('cfgTableHeadBg').value = cfg.table?.header_bg_color || '#593f8f';
            document.getElementById('cfgTableHeadText').value = cfg.table?.header_text_color || '#ffffff';
            document.getElementById('cfgTableOddRow').value = cfg.table?.odd_row_color || '#ffffff';
            document.getElementById('cfgTableEvenRow').value = cfg.table?.even_row_color || '#f5f4fb';
            document.getElementById('cfgTableAlign').value = cfg.table?.alignment || 'left';

            // Code Blocks
            document.getElementById('cfgCodeFontSize').value = cfg.elements?.code?.font_size || 10;
            document.getElementById('cfgCodeTextColor').value = cfg.elements?.code?.text_color || '#2c3e50';
            document.getElementById('cfgCodeBgColor').value = cfg.elements?.code?.background_color || '#f8f9fa';

            // Spacing
            document.getElementById('cfgLineSpacing').value = cfg.spacing?.line_spacing || 1.15;
            document.getElementById('cfgParagraphSpacing').value = cfg.spacing?.paragraph_spacing ?? 8;
            document.getElementById('cfgListLeftMargin').value = cfg.spacing?.list_left_margin ?? 24;
            document.getElementById('cfgListBulletGap').value = cfg.spacing?.list_bullet_gap ?? 6;

            // Table
            const tbl = cfg.table || {};
            document.getElementById('tbl_header_bg').value = tbl.header_bg_color || '#593f8f';
            document.getElementById('tbl_header_fg').value = tbl.header_text_color || '#ffffff';
            document.getElementById('tbl_odd_row').value = tbl.odd_row_color || '#ffffff';
            document.getElementById('tbl_even_row').value = tbl.even_row_color || '#f5f4fb';
            document.getElementById('tbl_border_color').value = tbl.border_color || '#cccccc';
            document.getElementById('tbl_border_width').value = tbl.border_width ?? 0.5;
            toggleSet('tbl_repeat_header', tbl.repeat_header ?? true);
            document.getElementById('tbl_cell_padding').value = tbl.cell_padding ?? 6;
            document.getElementById('tbl_header_fs').value = tbl.header_font_size ?? 10;
            document.getElementById('tbl_body_fs').value = tbl.body_font_size ?? 9;
            document.getElementById('tbl_alignment').value = tbl.alignment || 'left';

            // Cover
            toggleSet('cfgCoverEnabled', cfg.cover_page?.enabled ?? true);
            document.getElementById('cfgCoverH1Text').value = cfg.cover_page?.h1_text || 'Sample Document Title';
            document.getElementById('cfgCoverTitleSize').value = cfg.cover_page?.title_size ?? 36;
            document.getElementById('cfgCoverTitleColor').value = cfg.cover_page?.title_color || '#1A1A2E';
            document.getElementById('cfgCoverH2Text').value = cfg.cover_page?.h2_text || 'Subject Name';
            document.getElementById('cfgCoverH2Size').value = cfg.cover_page?.h2_size ?? 14;
            document.getElementById('cfgCoverH2Color').value = cfg.cover_page?.h2_color || '#7f8c8d';
            document.getElementById('cfgCoverHAlign').value = cfg.cover_page?.h_align || 'center';
            document.getElementById('cfgCoverVAlign').value = cfg.cover_page?.v_align || 'middle';
            toggleSet('cfgCoverShowDate', cfg.cover_page?.show_date ?? true);

            // Header/Titles
            toggleSet('cfgHeaderShowNoteTitle', cfg.header?.show_note_title ?? true);
            toggleSet('cfgHeaderShowSubjectName', cfg.header?.show_subject_name ?? true);
            toggleSet('cfgHeaderShowGroupName', cfg.header?.show_group_name ?? true);

            // Footer
            toggleSet('cfgFooterPageNumber', cfg.footer?.show_page_number ?? true);
            document.getElementById('cfgFooterText').value = cfg.footer?.custom_text || '';
            
            // Ensure element defaults are set for new elements if not in config
            if (cfg.elements) {
                if (!cfg.elements.note_title) {
                    cfg.elements.note_title = { alignment: 'left', text_color: '#2C3E50', background_color: null, font_weight: 'bold', font_size: 18, margin_top: 0, margin_bottom: 8 };
                }
                if (!cfg.elements.subject_name) {
                    cfg.elements.subject_name = { alignment: 'left', text_color: '#2C3E50', background_color: null, font_weight: 'bold', font_size: 14, margin_top: 0, margin_bottom: 8 };
                }
                if (!cfg.elements.group_name) {
                    cfg.elements.group_name = { alignment: 'left', text_color: '#2C3E50', background_color: null, font_weight: 'normal', font_size: 12, margin_top: 0, margin_bottom: 8 };
                }
                // Ensure all elements have margin properties
                ELEMENTS.forEach(el => {
                    if (!cfg.elements[el]) {
                        cfg.elements[el] = {};
                    }
                    if (cfg.elements[el].margin_top === undefined) {
                        cfg.elements[el].margin_top = 0;
                    }
                    if (cfg.elements[el].margin_bottom === undefined) {
                        cfg.elements[el].margin_bottom = 8;
                    }
                });
            }
        }

        function gatherConfig() {
            const elements = {};
            ELEMENTS.forEach(el => {
                // Get defaults based on element type
                let defaultSize = 11;
                let defaultWeight = 'normal';
                let defaultColor = '#2C3E50';
                
                if (el === 'note_title') {
                    defaultSize = 18;
                    defaultWeight = 'bold';
                } else if (el === 'subject_name') {
                    defaultSize = 14;
                    defaultWeight = 'bold';
                } else if (el === 'group_name') {
                    defaultSize = 12;
                }
                
                elements[el] = {
                    alignment: document.getElementById(`el_${el}_align`)?.value || 'left',
                    text_color: document.getElementById(`el_${el}_color`)?.value || defaultColor,
                    background_color: document.getElementById(`el_${el}_bg`)?.value || null,
                    font_weight: document.getElementById(`el_${el}_weight`)?.value || defaultWeight,
                    font_size: parseInt(document.getElementById(`el_${el}_size`)?.value || defaultSize),
                    margin_top: parseInt(document.getElementById(`el_${el}_margin_top`)?.value || 0),
                    margin_bottom: parseInt(document.getElementById(`el_${el}_margin_bottom`)?.value || 8),
                };
                if (el === 'list') {
                    elements[el].number_format = document.getElementById(`el_${el}_numfmt`)?.value || 'bullet';
                }
            });

            return {
                page: {
                    size: document.getElementById('cfgPageSize').value,
                    orientation: document.getElementById('cfgOrientation').value,
                    columns: parseInt(document.getElementById('cfgColumns').value),
                    margins: {
                        top: parseFloat(document.getElementById('cfgMarginTop').value),
                        bottom: parseFloat(document.getElementById('cfgMarginBottom').value),
                        left: parseFloat(document.getElementById('cfgMarginLeft').value),
                        right: parseFloat(document.getElementById('cfgMarginRight').value),
                    }
                },
                font_family: 'Instrument Sans',
                spacing: {
                    line_spacing: parseFloat(document.getElementById('cfgLineSpacing').value),
                    paragraph_spacing: parseInt(document.getElementById('cfgParagraphSpacing').value),
                    list_left_margin: parseInt(document.getElementById('cfgListLeftMargin').value),
                    list_bullet_gap: parseInt(document.getElementById('cfgListBulletGap').value),
                },
                elements: elements,
                table: {
                    header_bg_color: document.getElementById('cfgTableHeadBg').value,
                    header_text_color: document.getElementById('cfgTableHeadText').value,
                    odd_row_color: document.getElementById('cfgTableOddRow').value,
                    even_row_color: document.getElementById('cfgTableEvenRow').value,
                    alignment: document.getElementById('cfgTableAlign').value,
                },
                code_block: {
                    font_size: parseInt(document.getElementById('cfgCodeFontSize').value),
                    text_color: document.getElementById('cfgCodeTextColor').value,
                    background_color: document.getElementById('cfgCodeBgColor').value,
                },
                cover_page: {
                    enabled: document.getElementById('cfgCoverEnabled').classList.contains('active'),
                    h1_text: document.getElementById('cfgCoverH1Text').value || 'Sample Document Title',
                    title_size: parseInt(document.getElementById('cfgCoverTitleSize').value),
                    title_color: document.getElementById('cfgCoverTitleColor').value,
                    h2_text: document.getElementById('cfgCoverH2Text').value || 'Subject Name',
                    h2_size: parseInt(document.getElementById('cfgCoverH2Size').value),
                    h2_color: document.getElementById('cfgCoverH2Color').value,
                    h_align: document.getElementById('cfgCoverHAlign').value,
                    v_align: document.getElementById('cfgCoverVAlign').value,
                    show_date: document.getElementById('cfgCoverShowDate').classList.contains('active'),
                    show_author: false,
                },
                list_config: {
                    number_format: document.getElementById('cfgNumFormat').value || '1.',
                    custom_bullet: document.getElementById('cfgCustomBullet').value || '•',
                },
                header: {
                    enabled: true,
                    show_note_title: document.getElementById('cfgHeaderShowNoteTitle').classList.contains('active'),
                    show_subject_name: document.getElementById('cfgHeaderShowSubjectName').classList.contains('active'),
                    show_group_name: document.getElementById('cfgHeaderShowGroupName').classList.contains('active'),
                },
                footer: {
                    enabled: true,
                    show_page_number: document.getElementById('cfgFooterPageNumber').classList.contains('active'),
                    custom_text: document.getElementById('cfgFooterText').value,
                },
                image_defaults: { alignment: 'center', max_width_percent: 80 },
            };
        }

        function toggleSet(id, value) {
            const el = document.getElementById(id);
            if (value) el.classList.add('active');
            else el.classList.remove('active');
        }

        // ─── Element Styles Builder ──────────────────────────────

        function buildElementStyles(cfg) {
            const container = document.getElementById('elementStylesContainer');
            if (!container) {
                console.warn('Element styles container not found');
                return;
            }
            container.innerHTML = ELEMENTS.map(el => {
                const style = cfg.elements?.[el] || {};
                const label = ELEMENT_LABELS[el];
                const isListEl = el === 'list';
                
                // Set default font sizes for header elements
                let defaultSize = 11;
                if (el === 'note_title') defaultSize = 18;
                else if (el === 'subject_name') defaultSize = 14;
                else if (el === 'group_name') defaultSize = 12;
                
                return `
                    <div class="element-style-card">
                        <div class="element-name">${label}</div>
                        <div class="element-style-grid">
                            <div class="setting-row">
                                <label>Align</label>
                                <select id="el_${el}_align" onchange="markDirty(); updatePreview();">
                                    <option value="left" ${style.alignment === 'left' ? 'selected' : ''}>Left</option>
                                    <option value="center" ${style.alignment === 'center' ? 'selected' : ''}>Center</option>
                                    <option value="right" ${style.alignment === 'right' ? 'selected' : ''}>Right</option>
                                    <option value="justify" ${style.alignment === 'justify' ? 'selected' : ''}>Justify</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Text Color</label>
                                <input type="color" id="el_${el}_color" value="${style.text_color || '#2C3E50'}" onchange="markDirty(); updatePreview();">
                            </div>
                            <div class="setting-row">
                                <label>Background</label>
                                <input type="color" id="el_${el}_bg" value="${style.background_color || '#ffffff'}" onchange="markDirty(); updatePreview();" title="Full-width column background color">
                            </div>
                            <div class="setting-row">
                                <label>Weight</label>
                                <select id="el_${el}_weight" onchange="markDirty(); updatePreview();">
                                    <option value="normal" ${style.font_weight === 'normal' ? 'selected' : ''}>Normal</option>
                                    <option value="bold" ${style.font_weight === 'bold' ? 'selected' : ''}>Bold</option>
                                </select>
                            </div>
                            <div class="setting-row">
                                <label>Size (pt)</label>
                                <input type="number" id="el_${el}_size" value="${style.font_size || defaultSize}" min="8" max="60" onchange="markDirty(); updatePreview();">
                            </div>
                            <div class="setting-row">
                                <label>Top Margin (pt)</label>
                                <input type="number" id="el_${el}_margin_top" value="${style.margin_top ?? 0}" min="0" max="60" onchange="markDirty(); updatePreview();">
                            </div>
                            <div class="setting-row">
                                <label>Bottom Margin (pt)</label>
                                <input type="number" id="el_${el}_margin_bottom" value="${style.margin_bottom ?? 8}" min="0" max="60" onchange="markDirty(); updatePreview();">
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ─── Zoom Control ────────────────────────────────────────
        let currentZoom = 1;
        let currentPageView = 'contents'; // Track which page view is displayed: 'cover' or 'contents'
        
        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.1, 2);
            applyZoom();
        }
        
        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.1, 0.5);
            applyZoom();
        }
        
        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }

        // ─── Page View Control ───────────────────────────────────
        function showCoverPage() {
            currentPageView = 'cover';
            updatePageViewButtons();
            updatePreview();
        }

        function showContentsPage() {
            currentPageView = 'contents';
            updatePageViewButtons();
            updatePreview();
        }

        function updatePageViewButtons() {
            const coverBtn = document.getElementById('pageShowCover');
            const contentsBtn = document.getElementById('pageShowContents');
            if (coverBtn) {
                coverBtn.classList.toggle('active', currentPageView === 'cover');
            }
            if (contentsBtn) {
                contentsBtn.classList.toggle('active', currentPageView === 'contents');
            }
        }
        
        function applyZoom() {
            const page = document.getElementById('previewPage');
            if (page) {
                page.style.transform = `scale(${currentZoom})`;
            }
            const zoomLevelEl = document.getElementById('zoomLevel');
            if (zoomLevelEl) {
                zoomLevelEl.textContent = Math.round(currentZoom * 100) + '%';
            }
        }

        // ─── Live Preview ────────────────────────────────────────
        
        // Page size definitions in mm (width x height for portrait)
        const PAGE_SIZES = {
            'A4': { width: 210, height: 297 },
            'Letter': { width: 215.9, height: 279.4 },
            'Legal': { width: 215.9, height: 355.6 }
        };

        function updatePreview() {
            const cfg = gatherConfig();
            const PX_PER_PT = 793 / 595; // ≈ 1.333
            const page = document.getElementById('previewPage');
            if (!page) {
                console.warn('Preview page element not found');
                return;
            }
            const pageSize = PAGE_SIZES[cfg.page.size] || PAGE_SIZES['A4'];
            const isLandscape = cfg.page.orientation === 'landscape';
            
            // Calculate dimensions based on page size (A4 baseline: 210mm x 297mm = 793px x 1122px)
            const A4_WIDTH_MM = 210;
            const A4_HEIGHT_MM = 297;
            const A4_WIDTH_PX = 793;
            const A4_HEIGHT_PX = 1122;
            
            // Scale factor: pixels per mm
            const pxPerMm = A4_WIDTH_PX / A4_WIDTH_MM;
            
            // Calculate actual dimensions for selected page size
            let pageWidthPx = pageSize.width * pxPerMm;
            let pageHeightPx = pageSize.height * pxPerMm;
            
            // Swap for landscape
            if (isLandscape) {
                [pageWidthPx, pageHeightPx] = [pageHeightPx, pageWidthPx];
            }
            
            // Calculate margins in pixels
            const marginTopPx = cfg.page.margins.top * pxPerMm;
            const marginLeftPx = cfg.page.margins.left * pxPerMm;
            const marginBottomPx = cfg.page.margins.bottom * pxPerMm;
            const marginRightPx = cfg.page.margins.right * pxPerMm;
            
            page.style.width = pageWidthPx + 'px';
            page.style.height = pageHeightPx + 'px';
            page.style.padding = '0';
            page.style.transform = `scale(${currentZoom})`;
            page.style.transformOrigin = 'top center';

            // Build cover (outside columns)
            let coverHtml = '';
            if (cfg.cover_page.enabled) {
                // Determine vertical alignment
                let verticalAlign = 'center';
                let minHeight = '300px';
                if (cfg.cover_page.v_align === 'top') {
                    verticalAlign = 'flex-start';
                    minHeight = 'auto';
                } else if (cfg.cover_page.v_align === 'bottom') {
                    verticalAlign = 'flex-end';
                    minHeight = 'auto';
                }
                
                coverHtml = `
                    <div class="preview-cover" style="display: flex; flex-direction: column; justify-content: ${verticalAlign}; align-items: ${cfg.cover_page.h_align}; min-height: ${minHeight}; padding: 40px; text-align: ${cfg.cover_page.h_align};">
                        <div style="font-size: ${cfg.cover_page.title_size * PX_PER_PT}px; font-weight: bold; color: ${cfg.cover_page.title_color}; margin-bottom: 12px;">
                            ${cfg.cover_page.h1_text || 'Sample Document Title'}
                        </div>
                        <div style="font-size: ${cfg.cover_page.h2_size * PX_PER_PT}px; color: ${cfg.cover_page.h2_color};">${cfg.cover_page.h2_text || 'Subject Name'}</div>
                        ${cfg.cover_page.show_date ? `<div style="font-size: ${10 * PX_PER_PT}px; color: #95a5a6; margin-top: 20px;">Generated: March 17, 2026</div>` : ''}
                    </div>
                `;
            }

            // Sample content using element styles
            // The preview div is 793px wide but CSS-scaled to 0.75 (595px visual).
            // To match PDF proportions (595pt wide), font sizes need ×(793/595)=×1.333
            // so that after scale(0.75) they appear at the correct pt proportion.
            const elStyle = (key) => {
                const s = cfg.elements[key] || {};
                const PX_PER_PT = 793 / 595;
                if (key === 'code') {
                    const c = cfg.code_block || {};
                    return `font-family: 'Courier New', monospace; font-size: ${(c.font_size || 9) * PX_PER_PT}px; color: ${c.text_color || '#2c3e50'}; background-color: ${c.background_color || '#f8f9fa'}; padding: 12px; border-radius: 4px; display: block; white-space: pre-wrap; margin: 12px 0; border: 1px solid #e1e4e8;`;
                }
                return `text-align: ${s.alignment || 'left'}; color: ${s.text_color || '#2C3E50'}; font-weight: ${s.font_weight || 'normal'}; font-size: ${(s.font_size || 11) * PX_PER_PT}px; line-height: ${cfg.spacing.line_spacing};`;
            };

            // Wrap element with background if applicable
            const wrapElement = (key, content) => {
                const s = cfg.elements[key] || {};
                const style = elStyle(key);
                if (key === 'code') return `<div style="${style}">${content}</div>`;
                const bgColor = s.background_color || null;
                const marginTopPx = (s.margin_top ?? 0) * PX_PER_PT;
                const marginBottomPx = (s.margin_bottom ?? 8) * PX_PER_PT;
                if (bgColor && bgColor !== '#ffffff' && bgColor.toLowerCase() !== '#ffffff') {
                    const padding = 8; // tight padding
                    return `<div style="background: ${bgColor}; padding: ${padding}px 0; margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;"><div style="${style} padding: 0 ${padding}px;">${content}</div></div>`;
                } else {
                    return `<div style="${style} margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;">${content}</div>`;
                }
            };

            const tableHtml = () => {
                const t = cfg.table || {};
                const PX_PER_PT = 793 / 595;
                const pSize = (cfg.elements['paragraph']?.font_size || 11) * PX_PER_PT;
                const hSize = pSize + 2;
                const bSize = pSize - 2;
                
                return `
                    <div style="margin: 16px 0; width: 100%; overflow: hidden; border: 1px solid #cccccc; border-radius: 4px;">
                        <table style="width: 100%; border-collapse: collapse; font-family: 'Instrument Sans', sans-serif; text-align: ${t.alignment || 'left'};">
                            <thead>
                                <tr style="background-color: ${t.header_bg_color || '#593f8f'}; color: ${t.header_text_color || '#ffffff'}; font-weight: bold; font-size: ${hSize}px;">
                                    <th style="padding: 10px; border: 1px solid #cccccc;">Header 1</th>
                                    <th style="padding: 10px; border: 1px solid #cccccc;">Header 2</th>
                                    <th style="padding: 10px; border: 1px solid #cccccc;">Header 3</th>
                                </tr>
                            </thead>
                            <tbody style="font-size: ${bSize}px; color: #2C3E50;">
                                <tr style="background-color: ${t.odd_row_color || '#ffffff'};">
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Data Row 1</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Value A</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Status OK</td>
                                </tr>
                                <tr style="background-color: ${t.even_row_color || '#f5f4fb'};">
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Data Row 2</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Value B</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">In Progress</td>
                                </tr>
                                <tr style="background-color: ${t.odd_row_color || '#ffffff'};">
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Data Row 3</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Value C</td>
                                    <td style="padding: 8px; border: 1px solid #cccccc;">Pending</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            };

            let listHtml = () => {
                const s = cfg.elements['list'] || {};
                const marginPt = cfg.spacing?.list_left_margin || 24;
                const gapPt = cfg.spacing?.list_bullet_gap || 6;
                const bulletChar = cfg.list_config?.custom_bullet || '•';
                const style = elStyle('list');
                const bgColor = s.background_color || null;
                const marginTopPx = (s.margin_top ?? 0) * PX_PER_PT;
                const marginBottomPx = (s.margin_bottom ?? 8) * PX_PER_PT;
                
                const items = [
                    'First foundational concept',
                    'Second principle with supporting rationale',
                    'Third methodology for understanding',
                    'Fourth approach with practical examples',
                    'Fifth consideration for implementation',
                    'Sixth element completing the framework',
                    'Seventh point extending the discussion'
                ].map((text, idx) => {
                    const prefix = cfg.list_config?.number_format === '1.' ? (idx + 1) + '.' : 
                                   cfg.list_config?.number_format === '1)' ? (idx + 1) + ')' :
                                   cfg.list_config?.number_format === '1]' ? (idx + 1) + ']' : bulletChar;
                    return `<div style="display: flex; margin-left: ${marginPt * PX_PER_PT}px; margin-bottom: 4px;">
                        <div style="flex-shrink: 0; width: 20px; ${style}">${prefix}</div>
                        <div style="flex: 1; margin-left: ${gapPt * PX_PER_PT}px; ${style}">${text}</div>
                    </div>`;
                }).join('');
                
                if (bgColor && bgColor !== '#ffffff' && bgColor.toLowerCase() !== '#ffffff') {
                    return `<div style="background: ${bgColor}; padding: 8px 0; margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;"><div style="padding: 0 8px;">${items}</div></div>`;
                } else {
                    return `<div style="margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;">${items}</div>`;
                }
            };

            let unorderedListHtml = () => {
                const s = cfg.elements['list'] || {};
                const marginPt = cfg.spacing?.list_left_margin || 24;
                const gapPt = cfg.spacing?.list_bullet_gap || 6;
                const bulletChar = cfg.list_config?.custom_bullet || '•';
                const style = elStyle('list');
                const bgColor = s.background_color || null;
                const marginTopPx = (s.margin_top ?? 0) * PX_PER_PT;
                const marginBottomPx = (s.margin_bottom ?? 8) * PX_PER_PT;
                
                const items = [
                    'Maintain visual hierarchy through consistent heading styles',
                    'Use appropriate colors that convey meaning and maintain readability',
                    'Ensure adequate white space between sections and elements',
                    'Choose typography that balances professionalism with character',
                    'Test layouts with varying content lengths and volume'
                ].map((text) => {
                    return `<div style="display: flex; margin-left: ${marginPt * PX_PER_PT}px; margin-bottom: 4px;">
                        <div style="flex-shrink: 0; width: 20px; ${style}">${bulletChar}</div>
                        <div style="flex: 1; margin-left: ${gapPt * PX_PER_PT}px; ${style}">${text}</div>
                    </div>`;
                }).join('');
                
                if (bgColor && bgColor !== '#ffffff' && bgColor.toLowerCase() !== '#ffffff') {
                    return `<div style="background: ${bgColor}; padding: 8px 0; margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;"><div style="padding: 0 8px;">${items}</div></div>`;
                } else {
                    return `<div style="margin-top: ${marginTopPx}px; margin-bottom: ${marginBottomPx}px;">${items}</div>`;
                }
            };

            // Build header titles if any are enabled - each as separate element
            let headerHtml = '';
            if (cfg.header?.show_note_title) {
                headerHtml += wrapElement('note_title', 'Sample Note Title');
            }
            if (cfg.header?.show_subject_name) {
                headerHtml += wrapElement('subject_name', 'Sample Subject');
            }
            if (cfg.header?.show_group_name) {
                headerHtml += wrapElement('group_name', 'Sample Group');
