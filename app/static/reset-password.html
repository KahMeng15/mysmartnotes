<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/login.js"></script>
</head>

<body class="auth-page">
    <div class="auth-left">
        <div style="padding: 40px; text-align: center;">
            <h2 style="font-size: 2rem; margin-bottom: 20px;">Password Reset</h2>
            <p style="color: #666; line-height: 1.6;">
                We're validating your password reset link. Please wait...
            </p>
        </div>
    </div>

    <div class="auth-right">
        <div class="sidebar-brand" style="font-size: 3rem;">my<br>smart<br>notes</div>

        <!-- Reset Password Panel -->
        <div class="panel active" id="resetPasswordPanel">
            <div id="resetPasswordMsg" class="message-box"></div>
            <h2 style="font-size: 1.5rem; margin-bottom: 8px;">Create New Password</h2>
            <p style="color: #75757A; margin-bottom: 24px; font-size: 0.9rem;">Enter your new password below.</p>
            <form onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="resetPasswordNew">New Password</label>
                    <input class="form-input" type="password" id="resetPasswordNew" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="resetPasswordConfirm">Confirm Password</label>
                    <input class="form-input" type="password" id="resetPasswordConfirm" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-next btn-block" style="margin-top:16px;">Reset Password</button>
                <p class="toggle-link"><a href="/login.html">Back to login</a></p>
            </form>
        </div>
    </div>

    <script>
        // Redirect to login.html with reset_token param for better UX
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            if (token) {
                window.location.href = `/login.html?reset_token=${encodeURIComponent(token)}`;
            }
        });
    </script>
</body>

</html>
