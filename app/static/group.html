<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Details - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/group.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/group.js"></script>
    <script src="/js/footer.js"></script>
</head>

<body>

    <div class="page-card">
        <!-- Sticky Navigation Header -->
        <div class="note-sticky-header">
            <a href="mynotes.html" class="note-nav-back">
                <span>My Notes</span>
            </a>
        </div>

        <!-- Sticky Header Section -->
        <div class="page-card-header">
            <!-- Header -->
            <div class="page-header-row">
                <h1 id="groupTitle">Loading Group...</h1>
                <div class="d-flex gap-2">
                    <button onclick="openEditGroupModal()" class="btn btn-outline">
                        <i class="ph ph-pencil-simple"></i> Edit Group
                    </button>
                    <button onclick="goToUpload()" class="btn btn-primary">
                        <i class="ph ph-upload-simple"></i> Upload
                    </button>
                    <button onclick="deleteGroup()" class="btn btn-text" style="color: var(--color-error);">
                        <i class="ph ph-trash"></i> Delete Group
                    </button>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search subjects..." onkeyup="filterSubjects()">
                </div>
                <select id="sortSelect" class="form-control" onchange="sortSubjects()">
                    <option value="name">Name (A-Z)</option>
                    <option value="recent">Date Created</option>
                </select>
            </div>
        </div>

        <div class="page-card-content" style="padding-top: var(--spacing-md);">
            <!-- Subjects Grid Container -->
            <div class="group-section">
                <div id="subjectsGrid" class="subjects-grid">
                    <div class="empty-state">
                        <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                        <p>Loading subjects...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Group Modal -->
    <div id="editGroupModal" class="modal">
        <div class="modal-content">
            <h2>Edit Group</h2>
            <form onsubmit="handleEditGroup(event)">
                <div class="form-group">
                    <label>Group Name</label>
                    <input type="text" id="editGroupNameInput" class="form-control" required>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-save">Save Changes</button>
                    <button type="button" onclick="closeModal('editGroupModal')" class="btn-cancel">Cancel</button>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
