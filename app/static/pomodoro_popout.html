<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/pomodoro.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body.popout-mode { background: #fdfdfd; padding: 0; margin: 0; overflow: hidden; }
        .popout-container { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .mode-label { font-size: 14px; color: var(--color-gray); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; }
    </style>
</head>
<body class="popout-mode">
    <div class="popout-container">
        <div class="mode-label" id="modeLabel">Pomodoro</div>
        <div class="timer-display" id="timerDisplay" style="font-size: 80px; margin: 10px 0;">25:00</div>
        
        <div class="timer-controls">
            <button id="startBtn" class="btn btn-primary"><i class="ph ph-play"></i></button>
            <button id="pauseBtn" class="btn btn-outline" style="display:none;"><i class="ph ph-pause"></i></button>
            <button id="resetBtn" class="btn btn-outline"><i class="ph ph-arrows-clockwise"></i></button>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn btn-outline btn-small" id="settingsBtn" title="Set Time"><i class="ph ph-sliders"></i></button>
        </div>

        <div id="customTimeSection" style="display:none; margin-top:20px; text-align:center;">
            <div style="display:flex; justify-content:center; gap:5px; align-items:center;">
                <input type="number" id="customMins" min="0" max="999" style="width:50px; padding:5px;">
                <span>:</span>
                <input type="number" id="customSecs" min="0" max="59" style="width:45px; padding:5px;">
                <button class="btn btn-primary btn-small" id="applyTimeBtn"><i class="ph ph-check"></i></button>
            </div>
        </div>
    </div>
    <audio id="timerEndSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <script src="/js/auth.js"></script>
    <script src="/js/pomodoro.js"></script>
</body>
</html>
