<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Templates - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/templates.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/footer.js"></script>
</head>

<body>
    <div class="page-card">
        <div class="page-card-content">
            <!-- Index View: Grid of templates -->
            <div id="templatesIndexView" class="templates-index-view">
                <div class="d-flex justify-content-between align-items-center" style="margin-bottom: var(--spacing-xl);">
                    <h1><i class="ph ph-palette" style="margin-right: 8px;"></i> Export Templates</h1>
                    <button class="btn btn-primary" onclick="openCreateTemplateModal()">
                        <i class="ph ph-plus"></i> New Template
                    </button>
                </div>
                
                <div id="templatesGrid" class="templates-grid">
                    <div class="empty-state">
                        <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                        <p>Loading templates...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Template Modal -->
    <div id="createTemplateModal" class="modal">
        <div class="modal-content" style="min-height: auto;">
            <h3>Create New Template</h3>
            <input type="text" id="createTemplateInput" placeholder="Template name" style="width: 100%; padding: var(--spacing-md); border: 1px solid var(--color-light-gray); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); font-size: var(--font-size-md);" />
            <div class="modal-buttons">
                <button type="button" class="btn btn-primary" onclick="confirmCreateTemplate()">Create</button>
                <button type="button" class="btn btn-secondary" onclick="closeCreateTemplateModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Duplicate Template Modal -->
    <div id="duplicateModal" class="modal">
        <div class="modal-content" style="min-height: auto;">
            <h3>Duplicate Template</h3>
            <p style="margin-bottom: var(--spacing-md); color: var(--color-gray);" id="duplicateTemplateName"></p>
            <label style="display: block; margin-bottom: var(--spacing-sm); font-weight: 500; font-size: var(--font-size-sm);">New template name:</label>
            <input type="text" id="duplicateTemplateInput" placeholder="New template name" style="width: 100%; padding: var(--spacing-md); border: 1px solid var(--color-light-gray); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); font-size: var(--font-size-md);" />
            <div class="modal-buttons">
                <button type="button" class="btn btn-primary" onclick="confirmDuplicate()">Duplicate</button>
                <button type="button" class="btn btn-secondary" onclick="closeDuplicateModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Rename Template Modal -->
    <div id="renameModal" class="modal">
        <div class="modal-content" style="min-height: auto;">
            <h3>Rename Template</h3>
            <input type="text" id="renameInput" placeholder="Template name" style="width: 100%; padding: var(--spacing-md); border: 1px solid var(--color-light-gray); border-radius: var(--radius-md); margin-bottom: var(--spacing-lg); font-size: var(--font-size-md);" />
            <div class="modal-buttons">
                <button type="button" class="btn btn-primary" onclick="confirmRename()">Rename</button>
                <button type="button" class="btn btn-secondary" onclick="closeRenameModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Delete Template Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content" style="min-height: auto;">
            <h3>Delete Template?</h3>
            <p style="margin-bottom: var(--spacing-md); color: var(--color-gray);" id="deleteTemplateName"></p>
            <p style="margin-bottom: var(--spacing-lg); color: var(--color-error);">This action cannot be undone.</p>
            <div class="modal-buttons">
                <button type="button" class="btn" style="background: var(--color-error); color: white;" 
                    onmouseover="this.style.background='#c0392b'"
                    onmouseout="this.style.background='var(--color-error)'" onclick="confirmDelete()">Delete</button>
                <button type="button" class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        let templates = [];
        let selectedTemplateId = null;
        let isDirty = false;
        let pendingActionTemplateId = null;

        const ELEMENTS = ['h1', 'h2', 'h3', 'h4', 'h5', 'paragraph', 'list'];
        const ELEMENT_LABELS = {
            h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3',
            h4: 'Heading 4', h5: 'Heading 5',
            paragraph: 'Paragraph', list: 'List',
        };

        window.addEventListener('load', () => {
            loadTemplates();
            // Attach global click listener to close menus
            document.addEventListener('click', (e) => closeAllTemplateMenus(e));
            // Attach event delegation for menu items
            document.addEventListener('click', (e) => {
                if (e.target.closest('.duplicate-btn')) {
                    e.stopPropagation();
                    const btn = e.target.closest('.duplicate-btn');
                    const templateId = btn.dataset.templateId;
                    openDuplicateModal(templateId);
                } else if (e.target.closest('.rename-btn')) {
                    e.stopPropagation();
                    const btn = e.target.closest('.rename-btn');
                    const templateId = btn.dataset.templateId;
                    openRenameModal(templateId);
                } else if (e.target.closest('.delete-btn')) {
                    e.stopPropagation();
                    const btn = e.target.closest('.delete-btn');
                    const templateId = btn.dataset.templateId;
                    openDeleteModal(templateId);
                }
            });
        });

        // ─── API ─────────────────────────────────────────────────

        async function loadTemplates() {
            try {
                const res = await fetch('/templates', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    templates = await res.json();
                    renderTemplateList();
                }
            } catch (e) { console.error(e); }
        }

        function selectTemplate(templateId) {
            window.location.href = `/exporttemplate/${templateId}`;
        }

        async function saveTemplate() {
            if (!selectedTemplateId) return;
            const tmpl = templates.find(t => t.id === selectedTemplateId);
            if (!tmpl || tmpl.is_system) return;

            const config = gatherConfig();
            const name = document.getElementById('templateName').value.trim();
            if (!name) { alert('Template name is required'); return; }

            try {
                const res = await fetch(`/templates/${selectedTemplateId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, config })
                });
                if (res.ok) {
                    isDirty = false;
                    await loadTemplates();
                    selectTemplate(selectedTemplateId);
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to save');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function createNewTemplate(name) {
            if (!name) return;
            try {
                const res = await fetch('/templates', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    const newTmpl = await res.json();
                    await loadTemplates();
                    selectTemplate(newTmpl.id);
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        // ─── Modal Functions ──────────────────────────────────────

        function toggleTemplateMenu(event, templateId) {
            closeAllTemplateMenus();
            const dropdown = document.querySelector(`.template-menu-dropdown[data-template-id="${templateId}"]`);
            if (dropdown) {
                dropdown.classList.add('active');
            }
        }

        function closeAllTemplateMenus(event) {
            // Don't close if clicking on a menu item or button
            if (event && event.target.closest('.duplicate-btn, .rename-btn, .delete-btn, .template-menu-dropdown')) {
                return;
            }
            document.querySelectorAll('.template-menu-dropdown.active').forEach(menu => {
                menu.classList.remove('active');
            });
        }

        function openCreateTemplateModal() {
            const createInput = document.getElementById('createTemplateInput');
            createInput.value = '';
            createInput.focus();
            createInput.addEventListener('keypress', handleCreateTemplateKeypress);
            document.getElementById('createTemplateModal').classList.add('active');
        }

        function closeCreateTemplateModal() {
            document.getElementById('createTemplateModal').classList.remove('active');
            document.getElementById('createTemplateInput').removeEventListener('keypress', handleCreateTemplateKeypress);
        }

        function handleCreateTemplateKeypress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmCreateTemplate();
            }
        }

        async function confirmCreateTemplate() {
            const name = document.getElementById('createTemplateInput').value.trim();
            if (!name) {
                alert('Template name cannot be empty');
                return;
            }
            closeCreateTemplateModal();
            await createNewTemplate(name);
        }

        function openDuplicateModal(templateId) {
            closeAllTemplateMenus();
            pendingActionTemplateId = templateId;
            const tmpl = templates.find(t => t.id === templateId);
            if (tmpl) {
                document.getElementById('duplicateTemplateName').textContent = `Duplicating: "${tmpl.name}"`;
                const duplicateInput = document.getElementById('duplicateTemplateInput');
                duplicateInput.value = `${tmpl.name} copy`;
                duplicateInput.focus();
                duplicateInput.select();
                duplicateInput.addEventListener('keypress', handleDuplicateKeypress);
                document.getElementById('duplicateModal').classList.add('active');
            }
        }

        function closeDuplicateModal() {
            document.getElementById('duplicateModal').classList.remove('active');
            document.getElementById('duplicateTemplateInput').removeEventListener('keypress', handleDuplicateKeypress);
            pendingActionTemplateId = null;
        }

        function handleDuplicateKeypress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmDuplicate();
            }
        }

        async function confirmDuplicate() {
            const templateId = pendingActionTemplateId;  // Save ID before modal closes
            if (!templateId) {
                return;
            }
            const newName = document.getElementById('duplicateTemplateInput').value.trim();
            if (!newName) {
                alert('Template name cannot be empty');
                return;
            }
            closeDuplicateModal();
            
            try {
                const res = await fetch(`/templates/${templateId}/duplicate`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: newName })
                });
                if (res.ok) {
                    await loadTemplates();
                } else {
                    alert('Failed to duplicate template');
                }
            } catch (e) { 
                alert('Error duplicating template: ' + e.message); 
            }
        }

        function openRenameModal(templateId) {
            closeAllTemplateMenus();
            pendingActionTemplateId = templateId;
            const tmpl = templates.find(t => t.id === templateId);
            if (tmpl) {
                const renameInput = document.getElementById('renameInput');
                renameInput.value = tmpl.name;
                renameInput.focus();
                renameInput.select();
                renameInput.addEventListener('keypress', handleRenameKeypress);
                document.getElementById('renameModal').classList.add('active');
            }
        }

        function closeRenameModal() {
            document.getElementById('renameModal').classList.remove('active');
            document.getElementById('renameInput').removeEventListener('keypress', handleRenameKeypress);
            pendingActionTemplateId = null;
        }

        function handleRenameKeypress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                confirmRename();
            }
        }

        async function confirmRename() {
            const templateId = pendingActionTemplateId;  // Save ID before modal closes
            if (!templateId) {
                return;
            }
            const newName = document.getElementById('renameInput').value.trim();
            if (!newName) {
                alert('Template name cannot be empty');
                return;
            }

            const tmpl = templates.find(t => t.id === templateId);
            if (newName === tmpl.name) {
                closeRenameModal();
                return;
            }

            closeRenameModal();

            try {
                const res = await fetch(`/templates/${templateId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name: newName, config: tmpl.config })
                });
                if (res.ok) {
                    await loadTemplates();
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to rename');
                }
            } catch (e) {
                alert('Error renaming template: ' + e.message);
            }
        }

        function openDeleteModal(templateId) {
            closeAllTemplateMenus();
            pendingActionTemplateId = templateId;
            const tmpl = templates.find(t => t.id === templateId);
            if (tmpl && !tmpl.is_system) {
                document.getElementById('deleteTemplateName').textContent = `Delete "${tmpl.name}"?`;
                document.getElementById('deleteModal').classList.add('active');
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.remove('active');
            pendingActionTemplateId = null;
        }

        async function confirmDelete() {
            const templateId = pendingActionTemplateId;  // Save ID before modal closes
            if (!templateId) {
                return;
            }
            closeDeleteModal();

            try {
                const res = await fetch(`/templates/${templateId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    await loadTemplates();
                } else {
                    alert('Failed to delete template');
                }
            } catch (e) {
            }
        }

        // Close modals when clicking Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeCreateTemplateModal();
                closeDuplicateModal();
                closeRenameModal();
                closeDeleteModal();
            }
        });

        // ─── Render ──────────────────────────────────────────────

        function renderTemplateList() {
            const grid = document.getElementById('templatesGrid');
            if (templates.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="ph ph-pencil-ruler"></i>
                        <h3>No templates found</h3>
                        <p>Create a new template to get started.</p>
                    </div>`;
                return;
            }
            
            grid.innerHTML = templates.map(t => {
                const coverEnabled = t.config.cover_page?.enabled ?? true;
                const coverColor = t.config.cover_page?.title_color || '#1A1A2E';
                const h1Color = t.config.elements?.h1?.text_color || '#2C3E50';
                const bodyBg = '#ffffff';

                return `
                <div class="template-card" onclick="if (!event.target.closest('.template-menu-btn') && !event.target.closest('.template-menu-dropdown')) { window.location.href='/exporttemplate/${t.id}'; }">
                    <div class="template-preview-wrapper" style="background: ${bodyBg};">
                        <button class="template-menu-btn" onclick="event.stopPropagation(); toggleTemplateMenu(event, '${t.id}')">
                            <i class="ph ph-dots-three-vertical"></i>
                        </button>
                        <div class="template-menu-dropdown" data-template-id="${t.id}">
                            <button class="template-menu-item duplicate-btn" data-template-id="${t.id}">
                                <i class="ph ph-copy"></i> Duplicate
                            </button>
                            ${!t.is_system ? `
                                <button class="template-menu-item rename-btn" data-template-id="${t.id}">
                                    <i class="ph ph-pencil"></i> Rename
                                </button>
                                <button class="template-menu-item danger delete-btn" data-template-id="${t.id}">
                                    <i class="ph ph-trash"></i> Delete
                                </button>
                            ` : ''}
                        </div>
                        <div class="mini-doc-preview">
                            ${coverEnabled ? 
                                `<div class="mini-cover" style="color: ${coverColor};">Title</div>` : ''}
                            <div class="mini-content">
                                <div style="height: 6px; background: ${h1Color}; width: 60%; margin-bottom: 8px; border-radius: 2px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 80%; margin-bottom: 8px; border-radius: 1px;"></div>
                                
                                <div style="height: 5px; background: ${t.config.elements?.h2?.text_color || '#34495e'}; width: 40%; margin-bottom: 6px; border-radius: 2px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 90%; margin-bottom: 3px; border-radius: 1px;"></div>
                            </div>
                        </div>
                        <div class="preview-overlay">
                            <i class="ph ph-pencil-simple"></i> Edit Template
                        </div>
                    </div>
                    <div class="template-card-info">
                        <div class="template-card-title">${t.name}</div>
                        <span class="template-badge ${t.is_system ? '' : 'user'}">${t.is_system ? 'Default' : 'Custom'}</span>
                    </div>
                </div>
            `;
            }).join('');
        }

    </script>
</body>

</html>
