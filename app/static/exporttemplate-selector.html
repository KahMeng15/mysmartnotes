<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Export Templates - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/templates.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
</head>

<body>
    <div class="page-card">
        <div class="page-card-content">
            <!-- Index View: Grid of templates -->
            <div id="templatesIndexView" class="templates-index-view">
                <div class="d-flex justify-content-between align-items-center" style="margin-bottom: var(--spacing-xl);">
                    <h1><i class="ph ph-palette" style="margin-right: 8px;"></i> Export Templates</h1>
                    <button class="btn btn-primary" onclick="createNewTemplate()">
                        <i class="ph ph-plus"></i> New Template
                    </button>
                </div>
                
                <div id="templatesGrid" class="templates-grid">
                    <div class="empty-state">
                        <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                        <p>Loading templates...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        let templates = [];
        let selectedTemplateId = null;
        let isDirty = false;

        const ELEMENTS = ['h1', 'h2', 'h3', 'h4', 'h5', 'paragraph', 'list'];
        const ELEMENT_LABELS = {
            h1: 'Heading 1', h2: 'Heading 2', h3: 'Heading 3',
            h4: 'Heading 4', h5: 'Heading 5',
            paragraph: 'Paragraph', list: 'List',
        };

        window.addEventListener('load', () => {
            if (!token) window.location.href = 'login.html';
            loadTemplates();
        });

        // ─── API ─────────────────────────────────────────────────

        async function loadTemplates() {
            try {
                const res = await fetch('/templates', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    templates = await res.json();
                    renderTemplateList();
                }
            } catch (e) { console.error(e); }
        }

        async function saveTemplate() {
            if (!selectedTemplateId) return;
            const tmpl = templates.find(t => t.id === selectedTemplateId);
            if (!tmpl || tmpl.is_system) return;

            const config = gatherConfig();
            const name = document.getElementById('templateName').value.trim();
            if (!name) { alert('Template name is required'); return; }

            try {
                const res = await fetch(`/templates/${selectedTemplateId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, config })
                });
                if (res.ok) {
                    isDirty = false;
                    await loadTemplates();
                    selectTemplate(selectedTemplateId);
                } else {
                    const err = await res.json();
                    alert(err.detail || 'Failed to save');
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function createNewTemplate() {
            const name = prompt('Template name:');
            if (!name) return;
            try {
                const res = await fetch('/templates', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    const newTmpl = await res.json();
                    await loadTemplates();
                    selectTemplate(newTmpl.id);
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function duplicateSelectedTemplate() {
            if (!selectedTemplateId) return;
            try {
                const res = await fetch(`/templates/${selectedTemplateId}/duplicate`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (res.ok) {
                    const newTmpl = await res.json();
                    await loadTemplates();
                    selectTemplate(newTmpl.id);
                }
            } catch (e) { alert('Error: ' + e.message); }
        }

        async function deleteSelectedTemplate() {
            if (!selectedTemplateId) return;
            const tmpl = templates.find(t => t.id === selectedTemplateId);
            if (!tmpl || tmpl.is_system) return;
            if (!confirm(`Delete "${tmpl.name}"? This cannot be undone.`)) return;

            try {
                await fetch(`/templates/${selectedTemplateId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                selectedTemplateId = null;
                await loadTemplates();
                closeEditor();
            } catch (e) { alert('Error: ' + e.message); }
        }

        // ─── Render ──────────────────────────────────────────────

        function renderTemplateList() {
            const grid = document.getElementById('templatesGrid');
            if (templates.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <i class="ph ph-pencil-ruler"></i>
                        <h3>No templates found</h3>
                        <p>Create a new template to get started.</p>
                    </div>`;
                return;
            }
            
            grid.innerHTML = templates.map(t => {
                const coverEnabled = t.config.cover_page?.enabled ?? true;
                const coverColor = t.config.cover_page?.title_color || '#1A1A2E';
                const h1Color = t.config.elements?.h1?.text_color || '#2C3E50';
                const bodyBg = '#ffffff';

                return `
                <div class="template-card" onclick="window.location.href='/exporttemplate/${t.id}'">
                    <div class="template-preview-wrapper" style="background: ${bodyBg};">
                        <div class="mini-doc-preview">
                            ${coverEnabled ? 
                                `<div class="mini-cover" style="color: ${coverColor};">Title</div>` : ''}
                            <div class="mini-content">
                                <div style="height: 6px; background: ${h1Color}; width: 60%; margin-bottom: 8px; border-radius: 2px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 80%; margin-bottom: 8px; border-radius: 1px;"></div>
                                
                                <div style="height: 5px; background: ${t.config.elements?.h2?.text_color || '#34495e'}; width: 40%; margin-bottom: 6px; border-radius: 2px;"></div>
                                <div style="height: 3px; background: #ddd; width: 100%; margin-bottom: 3px; border-radius: 1px;"></div>
                                <div style="height: 3px; background: #ddd; width: 90%; margin-bottom: 3px; border-radius: 1px;"></div>
                            </div>
                        </div>
                        <div class="preview-overlay">
                            <i class="ph ph-pencil-simple"></i> Edit Template
                        </div>
                    </div>
                    <div class="template-card-info">
                        <div class="template-card-title">${t.name}</div>
                        <span class="template-badge ${t.is_system ? '' : 'user'}">${t.is_system ? 'Default' : 'Custom'}</span>
                    </div>
                </div>
            `;
            }).join('');
        }

    </script>
</body>

</html>
