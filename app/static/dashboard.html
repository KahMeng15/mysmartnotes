<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&family=Instrument+Serif:ital,opsz,wght@0,6..28,200..900;1,6..28,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/greetings.js"></script>
    <script src="/js/footer.js"></script>
</head>

<body>
    <!-- Main Content -->
    <div class="page-card">
        <div class="page-card-content">
            <!-- Welcome Section -->
            <div style="margin-bottom: var(--spacing-2xl);">
                <h1 class="welcome-heading"><em>Welcome back, <span id="userName">Student</span></em></h1>
                <p style="color: var(--color-gray); font-size: var(--font-size-lg);">Let's continue your learning journey</p>
            </div>

            <!-- Quick Stats -->
            <div class="dashboard-grid">
                <div class="card card-stat">
                    <div class="card-stat-value" id="totalSubjectsValue">0</div>
                    <div class="card-stat-label">Total Subjects</div>
                    <div class="card-stat-delta positive"><i class="ph ph-check"></i> Active</div>
                </div>
                <div class="card card-stat">
                    <div class="card-stat-value" id="totalNotesValue">0</div>
                    <div class="card-stat-label">Total Notes</div>
                    <div class="card-stat-delta positive"><i class="ph ph-trend-up"></i> Updated</div>
                </div>
                <div class="card card-stat">
                    <div class="card-stat-value" id="studyTimeValue">0m</div>
                    <div class="card-stat-label">Study Time (7d)</div>
                    <div class="card-stat-delta positive"><i class="ph ph-clock"></i> Focus</div>
                </div>
                <div class="card card-stat">
                    <div class="card-stat-value" id="questionsAskedValue">0</div>
                    <div class="card-stat-label">Questions (7d)</div>
                    <div class="card-stat-delta positive"><i class="ph ph-chat-circle"></i> Active</div>
                </div>
            </div>

            <!-- Quick Actions -->
            <h2 style="margin-top: var(--spacing-2xl);">Quick Actions</h2>
            <div class="quick-actions">
                <!-- Upload -->
                <a href="/upload" class="card action-btn quick-action" style="background: var(--color-accent-silk); color: var(--color-dark); text-decoration: none;" aria-label="Upload documents and files for processing">
                    <div class="icon" aria-hidden="true"><i class="ph ph-upload-simple"></i></div>
                    <div style="font-weight: 600;">Upload</div>
                </a>
                <!-- My Notes -->
                <a href="mynotes.html" class="card action-btn quick-action" style="background: var(--color-accent-silk); color: var(--color-dark); text-decoration: none;" aria-label="View and manage your notes, subjects, and groups">
                    <div class="icon" aria-hidden="true"><i class="ph ph-books"></i></div>
                    <div style="font-weight: 600;">My Notes</div>
                </a>
                <!-- Chat -->
                <a href="chat.html" class="card action-btn quick-action" style="background: var(--color-primary); color: white; text-decoration: none;" aria-label="Chat with AI for learning assistance">
                    <div class="icon" aria-hidden="true"><i class="ph ph-chat-dots"></i></div>
                    <div style="font-weight: 600;">Chat</div>
                </a>
                <!-- Start Quiz -->
                <a href="quiz_dashboard.html" class="card action-btn quick-action" style="background: var(--color-accent-pink); color: white; text-decoration: none;" aria-label="Start a quiz to test your knowledge">
                    <div class="icon" aria-hidden="true"><i class="ph ph-lightning"></i></div>
                    <div style="font-weight: 600;">Start Quiz</div>
                </a>

                <!-- Start Pomodoro -->
                <a href="#" class="card action-btn quick-action" style="background: var(--color-warning); color: white; text-decoration: none;" aria-label="Pomodoro timer (feature coming soon)" onclick="showToast('info', 'Pomodoro timer feature coming soon'); return false;">
                    <div class="icon" aria-hidden="true"><i class="ph ph-timer"></i></div>
                    <div style="font-weight: 600;">Pomodoro</div>
                </a>
            </div>

            <!-- Recent Notes -->
            <div style="margin-top: var(--spacing-2xl);">
                <h2 style="margin-top: var(--spacing-2xl);">Recent Notes</h2>
                <div id="recentLectures" class="lecture-list">
                    <div class="empty-state">
                        <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                        <p>Loading lectures...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Subject Modal -->
    <div id="subjectModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Create New Subject</h3>
                <button class="modal-close" onclick="closeModal('subjectModal')">&times;</button>
            </div>
            <form id="subjectForm" onsubmit="createSubject(event)">
                <div class="form-group">
                    <label>Subject Name</label>
                    <input type="text" id="subjectName" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="subjectDescription"></textarea>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <input type="color" id="subjectColor" value="#593C8F">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Subject</button>
            </form>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
    <script>
        // Initialize toast notification system on page load
        document.addEventListener('DOMContentLoaded', initToastContainer);
    </script>
</body>

</html>
