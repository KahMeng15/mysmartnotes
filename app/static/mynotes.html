<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Notes - MySmartNotes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <link rel="stylesheet" href="/styles/mynotes.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/utils.js"></script>
</head>

<body>
    <div class="page-card">
        <!-- Sticky Navigation Header -->
        <div class="note-sticky-header">
            <a href="/dashboard" class="note-nav-back">
                <span>Dashboard</span>
            </a>
        </div>

        <!-- Sticky Header Section -->
        <div class="page-card-header">
            <!-- Header -->
            <div class="page-header-row">
                <h1>My Notes</h1>
                <button onclick="openGroupModal()" class="btn btn-primary">
                    <i class="ph ph-plus"></i> Create Group
                </button>
            </div>

            <!-- Controls -->
            <div class="controls-bar">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search groups, subjects, lectures..."
                        onkeyup="filterNotes()">
                </div>
                <select id="sortSelect" class="form-control" onchange="sortNotes()">
                    <option value="name">Sort by Name (A-Z)</option>
                    <option value="date">Sort by Date Created</option>
                </select>
            </div>
        </div>

        <div class="page-card-content" style="padding-top: var(--spacing-md);">
            <!-- Groups Container -->
            <div id="notesContainer">
                <div class="empty-state">
                    <i class="ph ph-spinner-gap ph-spin" style="font-size: 32px;"></i>
                    <p>Loading your notes...</p>
                </div>
            </div>
        </div>

        <!-- Create Group Modal -->
        <div id="groupModal" class="modal">
            <div class="modal-content">
                <h2>Create New Group</h2>
                <form onsubmit="handleCreateGroup(event)">
                    <div class="form-group">
                        <label>Group Name</label>
                        <input type="text" id="groupNameInput" class="form-control" placeholder="e.g. Semester 1, Year 2"
                            required>
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn-save">Create Group</button>
                        <button type="button" onclick="closeModal('groupModal')" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Create Subject Modal -->
        <div id="subjectModal" class="modal">
            <div class="modal-content">
                <h2>Add New Subject</h2>
                <form onsubmit="handleCreateSubject(event)">
                    <input type="hidden" id="targetGroupId">
                    <div class="form-group">
                        <label>Subject Name</label>
                        <input type="text" id="subjectNameInput" class="form-control" placeholder="e.g. Calculus I"
                            required>
                    </div>
                    <div class="form-group">
                        <label>Description (Optional)</label>
                        <textarea id="subjectDescInput" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Color Tag</label>
                        <input type="color" id="subjectColorInput" value="#593C8F"
                            style="width: 100%; height: 40px; border: none; padding: 0;">
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn-save">Add Subject</button>
                        <button type="button" onclick="closeModal('subjectModal')" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Edit Group Modal -->
        <div id="editGroupModal" class="modal">
            <div class="modal-content">
                <h2>Edit Group</h2>
                <form onsubmit="handleEditGroup(event)">
                    <input type="hidden" id="editGroupId">
                    <div class="form-group">
                        <label>Group Name</label>
                        <input type="text" id="editGroupNameInput" class="form-control" required>
                    </div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn-save">Save Changes</button>
                        <button type="button" onclick="closeModal('editGroupModal')" class="btn-cancel">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '';
        const token = localStorage.getItem('token');
        const userStr = localStorage.getItem('user');
        const user = userStr ? JSON.parse(userStr) : null;

        let groupsData = [];
        let subjectsData = [];
        let ungroupedSubjects = [];
        let minimizedGroups = new Set(); // Track minimized group IDs

        window.addEventListener('load', () => {
            if (!token) window.location.href = '/login';
            fetchData();
        });

        async function fetchData() {
            try {
                // Fetch Groups
                const groupsRes = await fetch(`${API_URL}/groups`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (groupsRes.ok) groupsData = await groupsRes.json();

                // Fetch All Subjects
                const subjectsRes = await fetch(`${API_URL}/subjects`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (subjectsRes.ok) subjectsData = await subjectsRes.json();

                renderNotes();
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('notesContainer').innerHTML =
                    `<div class="empty-state">Error loading notes. Please try again.</div>`;
            }
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            // 1. Render Groups
            groupsData.forEach(group => {
                const groupSubjects = subjectsData.filter(s => s.group_id === group.id);
                const groupHtml = createGroupSection(group, groupSubjects);
                container.insertAdjacentHTML('beforeend', groupHtml);
            });

            // 2. Render Ungrouped Subjects
            const ungrouped = subjectsData.filter(s => !s.group_id);
            if (ungrouped.length > 0) {
                const ungroupedHtml = createGroupSection({ id: null, name: 'Ungrouped' }, ungrouped, true);
                container.insertAdjacentHTML('beforeend', ungroupedHtml);
            }

            if (groupsData.length === 0 && ungrouped.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="ph ph-notebook" style="font-size: 48px; margin-bottom: 1rem;"></i>
                        <h3>Welcome to My Notes</h3>
                        <p>Create a group or add a subject to get started.</p>
                        <button onclick="openGroupModal()" class="btn btn-primary" style="margin-top: 1rem;">Create First Group</button>
                    </div>
                `;
            }
        }

        function toggleGroupMinimize(groupId) {
            if (minimizedGroups.has(groupId)) {
                minimizedGroups.delete(groupId);
            } else {
                minimizedGroups.add(groupId);
            }
            // Update the DOM to show/hide subjects
            const groupElement = document.querySelector(`[data-group-id="${groupId}"] .subjects-grid`);
            if (groupElement) {
                groupElement.style.display = minimizedGroups.has(groupId) ? 'none' : 'grid';
            }
            // Update minimize button icon
            const minimizeBtn = document.querySelector(`[data-group-id="${groupId}"] .btn-minimize`);
            if (minimizeBtn) {
                minimizeBtn.innerHTML = minimizedGroups.has(groupId) ? '<i class="ph ph-caret-right"></i>' : '<i class="ph ph-caret-down"></i>';
            }
            // Update group-header border visibility
            const headerElement = document.querySelector(`[data-group-id="${groupId}"] .group-header`);
            if (headerElement) {
                if (minimizedGroups.has(groupId)) {
                    headerElement.classList.add('minimized');
                } else {
                    headerElement.classList.remove('minimized');
                }
            }
        }

        function createGroupSection(group, subjects, isUngrouped = false) {
            const isMinimized = minimizedGroups.has(group.id);
            
            // Generate Subject Cards
            const subjectsHtml = subjects.length > 0 ? subjects.map(s => `
                <div class="subject-card" onclick="event.stopPropagation(); openSubject('${s.id}')" style="border-left: 4px solid ${s.color || '#593C8F'};">
                    <div class="subject-title">${s.name}</div>
                    <p style="color: var(--color-gray); font-size: 0.9rem; margin-bottom: 1rem; flex: 1;">
                        ${s.description || 'No description'}
                    </p>
                    <div class="subject-meta">
                        <i class="ph ph-files"></i> View Lectures
                    </div>
                </div>
            `).join('') : `
                <div class="empty-state" style="grid-column: 1/-1; padding: var(--spacing-lg);">
                    No subjects in this group.
                </div>
            `;

            // Actions logic
            let actionsHtml = '';
            if (!isUngrouped) {
                actionsHtml = `
                    <div class="group-actions">
                        <button onclick="event.stopPropagation(); openSubjectModal('${group.id}')" class="btn btn-outline btn-small">
                            <i class="ph ph-plus"></i> Subject
                        </button>
                         <button onclick="event.stopPropagation(); location.href='upload.html?group_id=${group.id}'" class="btn btn-outline btn-small">
                            <i class="ph ph-upload-simple"></i> Upload
                        </button>
                        <button onclick="event.stopPropagation(); openEditGroupModal('${group.id}', '${group.name.replace(/'/g, "\\'")}')" class="btn btn-outline btn-small">
                            <i class="ph ph-pencil-simple"></i>
                        </button>
                        <button onclick="event.stopPropagation(); deleteGroup('${group.id}')" class="btn btn-outline btn-small">
                            <i class="ph ph-trash"></i>
                        </button>
                    </div>
                `;
            } else {
                // Ungrouped section actions (maybe just add subject?)
                actionsHtml = `
                     <div class="group-actions">
                        <button onclick="event.stopPropagation(); openSubjectModal(null)" class="btn btn-outline btn-small">
                            <i class="ph ph-plus"></i> Subject
                        </button>
                    </div>
                `;
            }

            // Build minimize button for non-ungrouped groups
            const minimizeButtonHtml = !isUngrouped ? `
                <button onclick="event.stopPropagation(); toggleGroupMinimize('${group.id}')" class="btn btn-outline btn-small btn-minimize">
                    ${isMinimized ? '<i class="ph ph-caret-right"></i>' : '<i class="ph ph-caret-down"></i>'}
                </button>
            ` : '';

            return `
                <div class="group-section" data-group-id="${group.id}" ${!isUngrouped ? `onclick="window.location.href='group.html?id=${encodeURIComponent(group.id)}'"` : ''} style="${!isUngrouped ? 'cursor: pointer;' : ''}">
                    <div class="group-header ${isMinimized ? 'minimized' : ''}">
                        <div style="display: flex; align-items: center; gap: var(--spacing-md);">
                            ${minimizeButtonHtml}
                            <div class="group-title">
                                ${group.name}
                            </div>
                        </div>
                        ${actionsHtml}
                    </div>
                    <div class="subjects-grid" ${isMinimized ? 'style="display: none;"' : ''}>
                        ${subjectsHtml}
                    </div>
                </div>
            `;
        }

        // --- Filters & Sort ---
        function filterNotes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            // Simple re-render with filtering logic could be complex if we want to filter hierarchy
            // For now, let's filter groups based on name matches OR if they contain matching subjects
            // This requires re-fetching or keeping logic in render.
            // Let's implement a simple DOM filter or data filter?
            // Data filter is cleaner.

            if (!query) {
                renderNotes();
                return;
            }

            const container = document.getElementById('notesContainer');
            container.innerHTML = '';

            // Filter logic: Show group if Group Name matches OR Subject Name matches
            // If Group Name matches, show all subjects in it? Or just matching?
            // Usually, show matching subjects.

            // Helper to check match
            const matches = (txt) => txt && txt.toLowerCase().includes(query);

            groupsData.forEach(group => {
                const groupMatches = matches(group.name);
                let groupSubjects = subjectsData.filter(s => s.group_id === group.id);

                if (groupMatches) {
                    // Show all subjects if group matches? Or filter subjects too?
                    // User said "search function should be able to find groups, subjects"
                    // If group matches, maybe show it all.
                } else {
                    // Filter subjects
                    groupSubjects = groupSubjects.filter(s => matches(s.name));
                }

                if (groupMatches || groupSubjects.length > 0) {
                    const groupHtml = createGroupSection(group, groupSubjects); // Note: might show empty subjects if only group name matched
                    container.insertAdjacentHTML('beforeend', groupHtml);
                }
            });

            // Ungrouped
            const ungrouped = subjectsData.filter(s => !s.group_id);
            const matchingUngrouped = ungrouped.filter(s => matches(s.name));
            if (matchingUngrouped.length > 0) {
                const html = createGroupSection({ id: null, name: 'Ungrouped' }, matchingUngrouped, true);
                container.insertAdjacentHTML('beforeend', html);
            }
        }

        function sortNotes() {
            const sortType = document.getElementById('sortSelect').value;
            // Sort groups and subjects
            if (sortType === 'name') {
                groupsData.sort((a, b) => a.name.localeCompare(b.name));
                subjectsData.sort((a, b) => a.name.localeCompare(b.name));
            } else if (sortType === 'date') {
                groupsData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                subjectsData.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            }
            renderNotes();
        }

        // --- Modals ---
        function openGroupModal() {
            document.getElementById('groupModal').classList.add('active');
            document.getElementById('groupNameInput').value = '';
            document.getElementById('groupNameInput').focus();
        }

        function openEditGroupModal(id, name) {
            document.getElementById('editGroupModal').classList.add('active');
            document.getElementById('editGroupId').value = id;
            document.getElementById('editGroupNameInput').value = name;
            document.getElementById('editGroupNameInput').focus();
        }

        function openSubjectModal(groupId) {
            document.getElementById('subjectModal').classList.add('active');
            document.getElementById('targetGroupId').value = groupId || '';
            document.getElementById('subjectNameInput').value = '';
            document.getElementById('subjectDescInput').value = '';

            // Auto-generate color
            const existingColors = subjectsData.map(s => s.color || '#593C8F');
            const newColor = generateContrastingColor(existingColors);
            document.getElementById('subjectColorInput').value = newColor;
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        // --- Actions ---
        async function handleCreateGroup(e) {
            e.preventDefault();
            const name = document.getElementById('groupNameInput').value;
            try {
                const res = await fetch(`${API_URL}/groups`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    closeModal('groupModal');
                    document.getElementById('groupNameInput').value = '';
                    showSuccessModal('Group Created', 'Your new group has been created successfully!');
                    fetchData(); // Reload
                } else {
                    alert('Failed to create group');
                }
            } catch (err) {
                alert('Failed to create group');
            }
        }

        async function handleEditGroup(e) {
            e.preventDefault();
            const id = document.getElementById('editGroupId').value;
            const name = document.getElementById('editGroupNameInput').value;
            try {
                const res = await fetch(`${API_URL}/groups/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name })
                });
                if (res.ok) {
                    closeModal('editGroupModal');
                    showSuccessModal('Group Updated', 'Your group has been updated successfully!');
                    fetchData(); // Reload
                } else {
                    alert('Failed to update group');
                }
            } catch (err) {
                alert('Error updating group');
            }
        }

        async function handleCreateSubject(e) {
            e.preventDefault();
            const name = document.getElementById('subjectNameInput').value;
            const desc = document.getElementById('subjectDescInput').value;
            const color = document.getElementById('subjectColorInput').value;
            const groupId = document.getElementById('targetGroupId').value;

            try {
                const res = await fetch(`${API_URL}/subjects`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        description: desc,
                        color,
                        group_id: groupId || null
                    })
                });
                if (res.ok) {
                    closeModal('subjectModal');
                    document.getElementById('subjectNameInput').value = '';
                    document.getElementById('subjectDescInput').value = '';
                    showSuccessModal('Subject Created', 'Your new subject has been created successfully!');
                    fetchData();
                } else {
                    alert('Failed to create subject');
                }
            } catch (err) {
                alert('Failed to create subject');
            }
        }

        async function deleteGroup(id) {
            showConfirmModal('Delete this group? Subjects in it will be deleted.', () => performDeleteGroup(id));
        }

        async function performDeleteGroup(id) {
            try {
                const res = await fetch(`${API_URL}/groups/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (res.ok) {
                    showSuccessModal('Group Deleted', 'The group has been deleted successfully!');
                    // Wait for modal to be rendered, then override the button
                    setTimeout(() => {
                        const successModal = document.getElementById('successModal');
                        const doneBtn = successModal.querySelector('.btn-save');
                        if (doneBtn) {
                            doneBtn.onclick = () => {
                                closeSuccessModal();
                                fetchData();
                            };
                        }
                    }, 100);
                } else {
                    const errorText = await res.text();
                    alert('Failed to delete group: ' + res.status);
                }
            } catch (err) {
                alert('Failed to delete group: ' + err.message);
            }
        }

        function openSubject(id) {
            window.location.href = `subject.html?id=${id}`;
        }

        function logout() {
            window.logout();
        }

        // Close modal on outside click
        window.onclick = function (event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('active');
            }
        }
    </script>
</body>

</html>
