<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MySmartNotes - AI-Powered Study Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/master.css">
    <script type="module" src="/js/firebase.js"></script>
    <style>
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
            background-color: var(--color-bg);
        }
        .hero-title {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: -0.05em;
        }
        .hero-subtitle {
            font-size: 1.25rem;
            color: var(--color-gray);
            max-width: 600px;
            margin-bottom: 2.5rem;
        }
        .cta-group {
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div class="landing-container">
        <div class="sidebar-brand" style="font-size: 1.5rem; margin-bottom: 4rem;">my<br>smart<br>notes</div>
        <h1 class="hero-title">Elevate your study game.</h1>
        <p class="hero-subtitle">Transform your lecture materials into structured, AI-enhanced study notes, quizzes, and more. All in one place.</p>
        
        <div class="cta-group">
            <a href="/login" class="btn btn-next" style="padding: 0.75rem 2rem; text-decoration: none;">Get Started</a>
            <a href="https://github.com/kahmeng15/mysmartnotes" target="_blank" class="btn btn-google" style="padding: 0.75rem 2rem; text-decoration: none; border: 1px solid var(--color-border);">View on GitHub</a>
        </div>
    </div>

    <script>
        // Check for existing session and redirect to dashboard if found
        (async function() {
            const token = localStorage.getItem('token');
            if (token) {
                try {
                    const res = await fetch('/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        window.location.href = '/dashboard';
                    }
                } catch (e) {
                    console.warn('Auth check failed:', e);
                }
            }
        })();
    </script>
</body>
</html>
