<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTTP Status Codes Diagnostics</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f5f5;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .category {
            margin-bottom: 30px;
        }

        .category-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ddd;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .status-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .status-card-image {
            width: 100%;
            height: 180px;
            background: #f0f0f0;
            object-fit: cover;
            border-bottom: 2px solid #e0e0e0;
        }

        .status-card-content {
            padding: 15px;
        }

        .status-code {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 5px;
        }

        .status-text {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .status-description {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 16px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            border: 1px solid #fcc;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 13px;
            margin-top: 40px;
            padding: 20px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .status-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }

            .status-card-image {
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐱 HTTP Status Codes Diagnostics</h1>
            <p>A fun exploration of HTTP status codes with cute cats from http.cat</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Loading status codes...</p>
            </div>
        </div>

        <div class="footer">
            <p>
                Status code images provided by <a href="https://http.cat/" target="_blank">http.cat</a>
                • Admin Diagnostics Panel
            </p>
        </div>
    </div>

    <script>
        async function loadStatusCodes() {
            try {
                const response = await fetch('/admin/http-status-codes', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const statusCodes = await response.json();
                renderStatusCodes(statusCodes);
            } catch (error) {
                console.error('Error loading status codes:', error);
                showError(`Failed to load status codes: ${error.message}`);
            }
        }

        function renderStatusCodes(statusCodes) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            for (const [category, codes] of Object.entries(statusCodes)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'category-title';
                titleDiv.textContent = category;
                categoryDiv.appendChild(titleDiv);

                const gridDiv = document.createElement('div');
                gridDiv.className = 'status-grid';

                for (const codeInfo of codes) {
                    const card = createStatusCard(codeInfo);
                    gridDiv.appendChild(card);
                }

                categoryDiv.appendChild(gridDiv);
                content.appendChild(categoryDiv);
            }
        }

        function createStatusCard(codeInfo) {
            const card = document.createElement('div');
            card.className = 'status-card';

            const img = document.createElement('img');
            img.className = 'status-card-image';
            img.src = `https://http.cat/${codeInfo.code}`;
            img.alt = `${codeInfo.code} - ${codeInfo.text}`;
            img.onerror = () => {
                // Fallback if image fails to load
                img.style.background = '#f0f0f0';
                img.style.display = 'flex';
                img.style.alignItems = 'center';
                img.style.justifyContent = 'center';
                img.alt = `Failed to load image for ${codeInfo.code}`;
            };

            const contentDiv = document.createElement('div');
            contentDiv.className = 'status-card-content';

            const codeDiv = document.createElement('div');
            codeDiv.className = 'status-code';
            codeDiv.textContent = codeInfo.code;

            const textDiv = document.createElement('div');
            textDiv.className = 'status-text';
            textDiv.textContent = codeInfo.text;

            const descDiv = document.createElement('div');
            descDiv.className = 'status-description';
            descDiv.textContent = codeInfo.description;

            contentDiv.appendChild(codeDiv);
            contentDiv.appendChild(textDiv);
            contentDiv.appendChild(descDiv);

            card.appendChild(img);
            card.appendChild(contentDiv);

            return card;
        }

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            document.getElementById('content').innerHTML = '';
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', loadStatusCodes);
    </script>
</body>
</html>
