name: Build and Push to GHCR

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Validate docker-compose files before doing anything expensive
  # ─────────────────────────────────────────────────────────────────────────────
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create stub env files (compose validation only — no real secrets)
        run: |
          touch secrets.env
          echo "DB_PASSWORD=ci-stub" >> secrets.env
          echo "SECRET_KEY=ci-stub-key-that-is-long-enough-32ch" >> secrets.env
          echo "APP_ENCRYPTION_KEY=ci-stub-encryption-key" >> secrets.env

      - name: Validate docker-compose.yml
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate docker-compose.standalone.yml
        run: docker compose -f docker-compose.standalone.yml config --quiet

  # ─────────────────────────────────────────────────────────────────────────────
  # Build and push Docker image
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: validate-compose
    # Only push on actual pushes (not PRs)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/kahmeng15/mysmartnotes
          tags: |
            # branch=main → :latest
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            # branch=dev  → :dev
            type=raw,value=dev,enable=${{ github.ref_name == 'dev' }}
            # always tag with short SHA for traceability
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          # Layer caching via GitHub Actions cache backend
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # Scan the pushed image for vulnerabilities
  # ─────────────────────────────────────────────────────────────────────────────
  scan-image:
    name: Scan Docker Image (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write   # needed to upload SARIF to GitHub Security tab

    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "image=ghcr.io/kahmeng15/mysmartnotes:latest" >> $GITHUB_OUTPUT
          else
            echo "image=ghcr.io/kahmeng15/mysmartnotes:dev" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.tag.outputs.image }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image