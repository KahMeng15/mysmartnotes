services:
  db:
    image: postgres:15-alpine
    container_name: mysmartnotes_db_dev
    environment:
      POSTGRES_USER: mysmartnotes
      POSTGRES_PASSWORD: mysmartnotespassword
      POSTGRES_DB: mysmartnotes
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - mysmartnotes-net-dev
    ports:
      - "5432:5432" # Expose for local development access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mysmartnotes"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mysmartnotes_api_dev
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://mysmartnotes:mysmartnotespassword@db:5432/mysmartnotes
    volumes:
      - .:/app # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

  worker:
    build: .
    container_name: mysmartnotes_worker_dev
    command: python -m watchfiles 'python -m app.worker_main' .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://mysmartnotes:mysmartnotespassword@db:5432/mysmartnotes
    volumes:
      - .:/app # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

  nginx:
    image: nginx:alpine
    container_name: mysmartnotes_frontend_dev
    depends_on:
      - api
    ports:
      - "${PORT:-8000}:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

networks:
  mysmartnotes-net-dev:
    driver: bridge
