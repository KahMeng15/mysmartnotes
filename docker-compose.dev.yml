services:
  db:
    image: postgres:15-alpine
    container_name: mysmartnotes_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-mysmartnotes}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-mysmartnotes}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - mysmartnotes-net-dev
    ports:
      - "5432:5432" # Expose for local development access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mysmartnotes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: mysmartnotes_redis_dev
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: mysmartnotes_api_dev
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

  worker:
    build: .
    container_name: mysmartnotes_worker_dev
    command: python -m watchfiles 'python -m app.worker_main' .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

  nginx:
    image: nginx:alpine
    container_name: mysmartnotes_frontend_dev
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./app/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./app/static:/app/static:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mysmartnotes-net-dev

networks:
  mysmartnotes-net-dev:
    driver: bridge
