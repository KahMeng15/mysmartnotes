services:
  db:
    image: postgres:15-alpine
    container_name: velonote_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-velonote}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-velonote}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - velonote-net-dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-velonote}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-backup:
    image: postgres:15-alpine
    container_name: velonote_db_backup_dev
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          export PGPASSWORD="$$DB_PASSWORD"
          RETENTION=$$(psql -Atc "SELECT backup_retention_days FROM system_settings LIMIT 1" 2>/dev/null || echo 7)
          RETENTION=$${RETENTION:-7}
          TS=$$(date +%Y%m%d_%H%M%S)
          pg_dump > "/backups/backup_$$TS.sql" 2>/dev/null
          find /backups -name "backup_*.sql" -mtime "+$$RETENTION" -delete 2>/dev/null
          sleep 86400
        done
    env_file:
      - .env
      - secrets.env
    environment:
      - PGHOST=db
      - PGUSER=${DB_USER:-velonote}
      - PGDATABASE=${DB_NAME:-velonote}
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - velonote-net-dev

  redis:
    image: redis:alpine
    container_name: velonote_redis_dev
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - velonote-net-dev
    ports:
      - "6379:6379"
    volumes:
      - ./data/infra/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kahmeng15/velonote:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velonote_api_dev
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --reload --reload-dir app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - velonote-net-dev

  worker:
    image: ghcr.io/kahmeng15/velonote:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: velonote_worker_dev
    command: python -m watchfiles 'python -m app.worker_main' app/
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - velonote-net-dev

  nginx:
    image: ghcr.io/kahmeng15/velonote:nginx-dev
    build:
      context: .
      dockerfile: app/Dockerfile.nginx
    container_name: velonote_frontend_dev
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - velonote-net-dev

volumes:
  pgdata:

networks:
  velonote-net-dev:
    driver: bridge
