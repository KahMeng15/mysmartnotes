services:
  db:
    image: postgres:15-alpine
    container_name: velonote_db_dev
    environment:
      POSTGRES_USER: ${DB_USER:-velonote}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-velonote}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - velonote-net-dev
    ports:
      - "5432:5432" # Expose for local development access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-velonote}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: velonote_redis_dev
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - velonote-net-dev
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ghcr.io/kahmeng15/velonote:dev
    container_name: velonote_api_dev
    command: python3 -m uvicorn app.main:app --host 0.0.0.0 --port ${API_PORT:-8000} --reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - velonote-net-dev

  worker:
    image: ghcr.io/kahmeng15/velonote:dev
    container_name: velonote_worker_dev
    command: python -m watchfiles 'python -m app.worker_main' .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - secrets.env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app  # Mount entire workspace for live-reload
    restart: unless-stopped
    networks:
      - velonote-net-dev

  nginx:
    image: ghcr.io/kahmeng15/velonote-nginx:dev
    container_name: velonote_frontend_dev
    depends_on:
      - api
    ports:
      - "${PUBLIC_PORT:-8000}:80"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - velonote-net-dev

networks:
  velonote-net-dev:
    driver: bridge
