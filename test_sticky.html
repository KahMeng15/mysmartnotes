<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: sans-serif; height: 2000px; padding: 20px; }
  .content { border: 1px solid #ccc; padding: 10px; }
  h1, h2, h3 { position: sticky; background: white; z-index: 10; margin: 0; padding: 10px 0; border-bottom: 1px solid #eee; }
  h1 { top: 0px; z-index: 13; }
  h2 { top: 40px; z-index: 12; }
  h3 { top: 80px; z-index: 11; }
</style>
</head>
<body>
  <div class="content">
    <h1>Heading 1</h1>
    <p style="height: 100px;">Text under H1...</p>
    <h2>Heading 2</h2>
    <p style="height: 100px;">Text under H2...</p>
    <h3>Heading 3</h3>
    <p style="height: 500px;">Text under H3...</p>
    <h2>Another Heading 2</h2>
    <p style="height: 500px;">Text under another H2...</p>
  </div>
</body>
</html>
